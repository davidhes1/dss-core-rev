    MQ(16, { stem: 'A college is introducing a new visitor sign-in system at its main reception.' }, [
      MP('(a)', { marks: 6, cmd: 'Draw', topic: '2.7', q: 'The requirements of the system are:\n- the visitor gives their name and the name of the person they are visiting to the receptionist\n- the receptionist enters these details into the visitor system\n- the visitor system sends a message to the member of staff being visited\n- the member of staff confirms they are expecting the visitor\n- the visitor system prints a visitor badge\n- the receptionist gives the badge to the visitor.\nDraw an information flow diagram for this system.', pts: ['Actors or entities shown: visitor, receptionist, visitor system, member of staff (1)', 'Visitor to receptionist: visitor name and host name (1)', 'Receptionist to visitor system: visitor details (1)', 'Visitor system to member of staff: arrival message, and member of staff to visitor system: confirmation (1)', 'Visitor system to receptionist: printed badge, and receptionist to visitor: badge (1)', 'Correct notation: one-way arrows, each labelled (1)'], alt: 'Accept alternative shapes and any other appropriate response.', model: 'Boxes: Visitor, Receptionist, Visitor system, Member of staff. Arrows: Visitor to Receptionist (Visitor name, Host name). Receptionist to Visitor system (Visitor details). Visitor system to Member of staff (Arrival message). Member of staff to Visitor system (Confirmation). Visitor system to Receptionist (Printed badge). Receptionist to Visitor (Badge). Every arrow is one-way and labelled.' }),
      MP('(b)', { marks: 9, cmd: 'Evaluate', topic: '1.3', levels: true,
        q: 'Two developers will build the visitor system in four weeks. The college already has a working badge printing program and a staff email system that could be reused. The college may later add a car park barrier to the system.\nEvaluate the suitability of using a bottom-up approach to develop the visitor system.',
        ind: ['Bottom-up: build and test small components first, then combine them into the full system', 'For: the badge printing program and staff email system are working components that can be reused, saving time', 'For: each component is tested on its own, so faults are found early', 'For: a car park barrier component could be added later without redesigning the whole system', 'For: the two developers can each build different components', 'Against: without an overall design first, components may not fit together and interfaces may need rework', 'Against: the overall needs of reception staff could be missed', 'Against: problems found when components are combined could appear close to the four week deadline', 'Comparison with top-down: starting from the overall problem helps meet requirements but delays working parts', 'Conclusion weighing these points in context'],
        model: 'A bottom-up approach suits this project in several ways. The college already has a working badge printing program and a staff email system, so the developers can start from tested components instead of building them again, which helps them meet the four week deadline. Each new component, such as the visitor details form, can be built and tested on its own, so faults are found early, and the two developers can work on different components at the same time. Because the system is built from separate parts, a car park barrier component could be added later without redesigning everything.\nThere are risks. Without an overall design first, the components may not fit together, and the links between the form, the email system and the badge printer may need reworking. The developers could also focus on the parts and miss what reception staff need from the system as a whole. Integration problems often appear when components are combined, which could happen close to the deadline.\nOverall, bottom-up is suitable because so much can be reused and the system is likely to grow. To reduce the risks, the developers should agree a simple overall design and the interfaces between components before they start building.' })
    ]),
    MQ(17, { stem: 'A field technician installs and troubleshoots network equipment at customer sites. They need a laptop that runs network monitoring and diagnostic software, connects directly to switches using an Ethernet cable, and works a full eight hour day without mains power. They carry their tools between sites on foot and by van.', table: { cap: 'Figure 6: two possible laptops', head: ['Component', 'Device A', 'Device B'], rows: [['Processor', '4 cores, 2.4 GHz', '8 cores, 3.8 GHz'], ['RAM', '16 GB', '32 GB'], ['Storage', '512 GB SSD', '1 TB SSD'], ['Battery life', '12 hours', '4 hours'], ['Weight', '1.3 kg', '2.6 kg'], ['Ports', 'Ethernet, 2 x USB-C', '3 x USB-C, no Ethernet']] } }, [
      MP('', { marks: 12, cmd: 'Evaluate', topic: '2.4', levels: true,
        q: 'Evaluate how well Device A and Device B meet the technician\'s needs.',
        ind: ['Device A: 12 hour battery covers a full day away from mains power, a key need', 'Device A: built-in Ethernet port connects directly to switches without an adapter', 'Device A: 1.3 kg is easier to carry between sites', 'Device A: 4 cores, 2.4 GHz and 16 GB RAM are enough for monitoring and diagnostic tools, though slower for heavy tasks', 'Device A: 512 GB SSD is enough for tools and logs', 'Device B: 8 cores, 3.8 GHz and 32 GB RAM give far more processing power for running several tools at once', 'Device B: 4 hour battery would run out halfway through the day', 'Device B: no Ethernet port, so an adapter must be carried, which could be lost or fail', 'Device B: 2.6 kg is heavier to carry', 'Conclusion: Device A better matches the stated needs because battery, Ethernet and weight matter more than extra power for this work'],
        model: 'Device A matches the technician\'s most important needs. Its 12 hour battery covers a full eight hour day away from mains power, with time to spare. It has a built-in Ethernet port, so it can connect directly to switches without an adapter. At 1.3 kg it is easy to carry between sites. Its 4 cores, 2.4 GHz processor and 16 GB of RAM are modest, but monitoring and diagnostic tools are not usually demanding, so this should be enough, although heavy tasks would run more slowly. The 512 GB SSD gives plenty of fast storage for tools and logs.\nDevice B is far more powerful. With 8 cores at 3.8 GHz and 32 GB of RAM it could run several tools at once and analyse large captures quickly, and its 1 TB SSD holds more data. However, its 4 hour battery would run out halfway through the day, so the technician would need to find mains power at every site. It has no Ethernet port, so an adapter would have to be carried, and if it was lost or failed the laptop could not connect to a switch. At 2.6 kg it is also twice as heavy to carry.\nOverall, Device A is more suitable. The technician needs all-day battery, direct Ethernet and portability more than extra processing power, and Device A meets all three. Device B would only be better for a technician based at one desk who runs very demanding software.' })

    MQ(9, {}, [MP('', { marks: 4, cmd: 'Explain', topic: '7.3b', q: 'Explain two protocols used when sending and receiving email.', pts: ['SMTP (1) sends email from the client to the mail server and between servers (1)', 'IMAP (1) keeps email on the server, so it stays in sync across several devices (1)', 'POP (1) downloads email from the server to one device (1)'], alt: 'Max 4 marks.', model: 'SMTP is used to send email from the user\'s device to the mail server and between mail servers. IMAP is used to read email, keeping messages on the server so they stay in sync on every device.' })]),
    MQ(10, {}, [MP('', { marks: 6, cmd: 'Discuss', topic: '4.1', levels: true,

      ind: ['Data protection: personal data used for a clear purpose, kept secure and accurate, and not kept longer than needed', 'Security: personal phones may be lost or shared, so strong authentication and encryption are needed', 'Equality Act: shift swapping must not disadvantage staff with protected characteristics, such as disability or pregnancy', 'Accessibility: as a public sector body, the trust must make the app accessible and publish an accessibility statement', 'Digital inclusion: not every nurse has a suitable smartphone, data allowance or digital skills, so an alternative is needed', 'User characteristics such as age, digital skills and additional needs affect how easily nurses use it', 'Training and support for staff'],

      MP('(c)', { marks: 9, cmd: 'Evaluate', topic: '6.1', levels: true,
        q: 'Threadline plans to replace most of its customer service team with a generative AI chatbot that answers questions about orders, sizes and returns 24 hours a day. Some of its customers are older or have additional needs.\nEvaluate the impact of this plan on Threadline and its customers.',
        ind: ['For Threadline: lower staffing costs and support available 24 hours a day', 'For Threadline: the chatbot handles many enquiries at once during busy sales', 'For customers: instant answers to common questions at any time', 'Against: job losses for customer service staff and a shift in the skills needed', 'Against: less human decision making and empathy for complaints or complex problems', 'Against: generative AI can give wrong or invented answers, which harms trust', 'Against: older customers or those with additional needs may find chatbots hard to use, risking audience exclusion', 'Data protection: the chatbot handles personal order data, which must be kept secure', 'Conclusion: suitable for simple queries if human support stays available for complex cases and accessibility needs'],
        model: 'For Threadline, the main benefit is cost. A chatbot can answer questions about orders, sizes and returns 24 hours a day without wages, and it can handle many customers at once during busy sales. Customers benefit from instant answers at any time instead of waiting in a queue.\nThere are serious drawbacks. Most of the customer service team would lose their jobs, and the remaining staff would need new skills to manage the chatbot. A chatbot has no empathy, so complaints and complex problems may be handled badly, and generative AI can give confident but wrong answers, for example about a return, which damages trust. Older customers and those with additional needs may struggle to use a chatbot, so they could be excluded, which harms Threadline\'s reputation and sales. The chatbot also handles personal order data, which must be protected.\nOverall, the plan is suitable for simple, common questions, where speed and cost matter most. Threadline should keep a smaller human team for complaints, complex queries and customers who need extra support. Replacing most staff with no human option would risk losing customers and trust.' })

      MP('(c)', { marks: 3, cmd: 'Explain with additional justification', topic: '5.3', q: 'Explain with additional justification one impact on the firm of a ransomware attack.', pts: ['Case files could not be accessed (1)', 'because the ransomware has encrypted them (1)', 'so court deadlines could be missed, harming clients and the firm\'s reputation (1)'], alt: 'Accept financial loss, legal action or loss of trust, with justification.', model: 'Staff could not open the case files, because the ransomware has encrypted them. Court deadlines could then be missed, which harms clients and damages the firm\'s reputation.' }),
      MP('(d)', { marks: 9, cmd: 'Evaluate', topic: '7.5', levels: true,
        q: 'The firm is considering moving its case files from the office server to a public cloud storage service (SaaS). The office internet connection is sometimes unreliable. Staff often work from home and at court.\nEvaluate the suitability of moving the case files to public cloud storage.',
        ind: ['For: staff can reach files from home and at court, which improves portability', 'For: the provider manages hardware, backups and physical security, which removes the unlocked cupboard risk', 'For: elasticity: storage grows as the number of cases grows, without buying hardware', 'For: cost effective: pay per user instead of buying and maintaining a server', 'Against: relies on the internet connection, which is sometimes unreliable in the office', 'Against: relies on the provider, with less control over where the data is stored', 'Against: confidential client data must meet data protection requirements, so the provider and settings must be checked', 'Security: MFA and access controls are needed because files can be reached from anywhere', 'Conclusion weighing these points, for example suitable if MFA is used and offline access or a better connection is arranged'],
        model: 'Moving to public cloud storage has clear benefits for this firm. Staff often work from home and at court, and cloud storage would let them reach case files from anywhere. The provider would manage the hardware, backups and physical security, which removes the risk of the unlocked server cupboard next to the public waiting area. Storage can grow as the number of cases grows, and the firm pays per user instead of buying and maintaining its own server.\nThere are drawbacks. The office internet connection is sometimes unreliable, so staff in the office could lose access to files when they need them. The firm would rely on the provider and have less control over where its data is stored. Client case files are highly confidential, so the firm must check that the provider meets data protection requirements, and because the files can be reached from anywhere, strong access controls and MFA are essential.\nOverall, cloud storage is suitable, because it solves the firm\'s two biggest problems: remote access and physical security. However, the firm should improve its internet connection or use a service that keeps offline copies on staff devices, and it must turn on MFA before moving any files.' })

        ind: ['Phased: the system is introduced in stages, for example one office or one part of the system at a time', 'Phased for: problems are found and fixed early while most of the service carries on as normal', 'Phased for: training can be spread out and worries handled gradually, which reduces resistance', 'Phased for: lessons from the first stage improve later stages', 'Phased against: takes longer, and running old and new methods together can confuse staff and split records', 'Direct for: quickest and cheapest, everyone moves at once and there is one set of records', 'Direct against: high risk; if the system fails, clients cannot be supported and there is no fallback', 'Direct against: all staff must be trained before the switch, which is hard with mixed digital skills', 'Rollback planning, testing and training are needed whichever method is chosen', 'Conclusion: phased is more suitable because clients must still be supported and staff need time, despite taking longer'],
        model: 'A phased implementation would introduce the system in stages, for example one office at a time. This suits the charity because it cannot stop supporting clients. If the first office finds a problem, it can be fixed while the other three carry on as normal, so clients are not left without help. Training can also be spread out, so staff with weaker digital skills get more support, and worried staff can see the system working in another office first, which should reduce resistance. Lessons from each stage make the next one smoother.\nThe drawbacks of a phased approach are time and complexity. The changeover takes longer, and while some offices use the new system and others use paper and spreadsheets, records are split, which could cause confusion when clients move between offices.\nA direct changeover would be the quickest and cheapest option, which matters with a limited budget, and everyone would use one set of records from day one. However, it is high risk. If the system fails or staff cannot use it, every office is affected at once and clients cannot be supported, and there is no fallback. All 40 staff would also need training before the switch, which is difficult with mixed skills.\nOverall, a phased implementation is more suitable. Protecting the service to clients and giving staff time to adjust matter more than speed. Whichever method is used, the charity should test the system fully, plan how to roll back if it fails, and train staff before each stage.' })

    MQ(12, {}, [MP('', { marks: 6, cmd: 'Discuss', topic: '3.7', levels: true,
      q: 'A city council has installed 2,000 traffic sensors that send readings every ten seconds. It also collects images from traffic cameras and public social media posts about traffic.\nDiscuss how the six Vs of Big Data affect the way the council stores and processes this data.',
      ind: ['Volume: a very large and growing amount of data needs scalable storage, such as cloud or a data lake', 'Velocity: readings arrive constantly, so they must be processed as they arrive to be useful for live traffic control', 'Variety: numbers, images and text need different storage and processing, which suits a data lake', 'Veracity: faulty sensors and unreliable posts mean data must be cleaned and validated before decisions are made', 'Variability: traffic patterns change at rush hour and in bad weather, and the meaning of posts varies', 'Value: only some data is useful, so it should be filtered or summarised to support decisions', 'Links between the Vs, such as high volume and velocity making cleaning harder'],
      model: 'Volume and velocity are the biggest challenges. Two thousand sensors sending readings every ten seconds create a very large amount of data that keeps growing, so the council needs storage that can scale, such as cloud storage. The readings are only useful for managing traffic if they are processed as they arrive, so the system needs to handle a constant stream rather than a weekly batch.\nVariety matters because sensor readings are numbers, camera feeds are images and social media posts are free text. These cannot all go into one simple table, so a data lake that keeps each type in its original format would suit the council.\nVeracity is a concern. A faulty sensor could report impossible speeds, and social media posts may be wrong or exaggerated, so the data must be cleaned and validated before it is trusted. Variability also matters, because traffic changes at rush hour and in bad weather, so patterns must be compared across similar times.\nFinally, value: much of the data will never be used, so the council should filter and summarise it to keep what helps it make decisions.' })])

      MP('(c)', { marks: 6, cmd: 'Draw', topic: '1.2', q: 'The password reset process is:\n- start\n- the user enters their username\n- if the username is not found, show "Account not found" and end\n- if it is found, send a reset code to the user\'s phone\n- the user enters the code\n- if the code is correct, the user enters a new password, it is saved and the process ends\n- if the code is wrong, the user enters the code again.\nDraw a flowchart for this process.', pts: ['Start and end terminators (1)', 'Input or output symbols for entering the username and code, and showing the message (1)', 'Decision for username found, with two labelled exits (1)', 'Process for sending the code and for saving the new password (1)', 'Decision for code correct, with the wrong path looping back to entering the code (1)', 'Correct overall logic, with arrows showing the flow (1)'], alt: 'Accept any other appropriate flowchart that represents the process.', model: 'Start (terminator), then Enter username (input). Decision: Username found? No: Show "Account not found" (output), then End. Yes: Send reset code to phone (process), then Enter code (input). Decision: Code correct? No: arrow loops back to Enter code. Yes: Enter new password (input), Save password (process), then End (terminator).' })

    MQ(15, { stem: 'A chain of bookshops wants to understand customer buying habits. It collects data from its tills, its website and a loyalty app.' }, [

      MP('(c)', { marks: 9, cmd: 'Evaluate', topic: '3.12', levels: true,
        q: 'The chain is deciding whether to store all of its data in a data lake or a data warehouse. The data includes till transactions, website orders, loyalty app activity and customer reviews written as free text. The chain has a small IT team.\nEvaluate the suitability of a data lake and a data warehouse for the chain.',
        ind: ['Data lake: stores raw data in its original format, including unstructured reviews and app activity', 'Data lake: quick to load data, nothing is lost, and new sources can be added easily', 'Data lake: data must be cleaned before analysis, which needs skills the small team may lack, and it can become a disorganised data swamp', 'Data warehouse: cleaned, structured data from many sources, ready for reporting and analysis', 'Data warehouse: consistent and trusted data for decisions about stock and offers', 'Data warehouse: data must be structured before loading, and free text reviews do not fit easily', 'Data warehouse: designing it takes time and cost', 'Combination: use a lake for raw data and feed a warehouse with cleaned data for reporting', 'Conclusion weighing the small IT team, the variety of data and the need for analysis'],
        model: 'A data lake would suit the variety of the chain\'s data. It stores data in its original format, so till transactions, website orders, app activity and free text reviews can all be kept without first being reshaped. Loading data is quick and nothing is thrown away, so new sources could be added later. The drawback is that the raw data must be cleaned before it can be analysed, and with a small IT team the lake could become disorganised, so finding trustworthy answers would be slow.\nA data warehouse holds cleaned, structured data from many sources, so it is ready for reports, such as which genres sell best in each shop. The data is consistent, so managers can trust it when planning stock and offers. However, data must be structured before it is loaded, which takes design work, and free text reviews do not fit neatly into tables.\nOverall, the warehouse is more suitable for the chain\'s main aim of understanding buying habits, because its small team needs data that is ready to analyse. The reviews could be kept in a small data lake, or codified into ratings, so they are not lost.' })

    MQ(16, { stem: 'A college\'s IT support team will replace 300 classroom PCs during the six week summer holiday.', table: { cap: 'Figure 3: project activities', head: ['Activity', 'Predecessor', 'Description and duration'], rows: [['A', 'None', 'Order new PCs (1 week)'], ['B', 'None', 'Remove old PCs (2 weeks)'], ['C', 'A', 'Install the software image on the new PCs (2 weeks)'], ['D', 'B, C', 'Install new PCs in classrooms (2 weeks)'], ['E', 'D', 'Test and sign off (1 week)']] } }, [
      MP('(a)', { marks: 6, cmd: 'Draw', topic: '2.9', q: 'Using Figure 3, draw a Gantt chart for the project.', pts: ['Time axis labelled in weeks, covering weeks 1 to 6 (1)', 'One labelled bar for each activity (1)', 'A and B both start at the beginning of week 1 (1)', 'C starts after A ends, at the start of week 2 (1)', 'D starts after both B and C end, at the start of week 4 (1)', 'E runs in week 6 and the bar lengths match the durations (1)'], alt: 'Accept a chart drawn in days if consistent.', model: 'Weeks 1 to 6 across the top. A: week 1. B: weeks 1 to 2. C: weeks 2 to 3. D: weeks 4 to 5. E: week 6. The project fits exactly into the six week holiday.' }),
      MP('(b)', { marks: 9, cmd: 'Evaluate', topic: '2.9', levels: true,
        q: 'The team leader plans to use a Waterfall methodology for the PC replacement.\nEvaluate the suitability of a Waterfall methodology for this project.',
        ind: ['Requirements are clear and fixed: replace 300 PCs, which suits Waterfall', 'The deadline is fixed by the end of the holiday, and Waterfall plans each stage in order with clear milestones', 'Stages depend on each other (order, image, install, test), matching Waterfall\'s sequence', 'Good documentation and sign-off at each stage helps accountability', 'Drawback: testing comes late, so problems with the image could be found when there is little time left', 'Drawback: it is hard to change course if PCs are delivered late', 'Agile would allow early feedback, such as piloting one classroom first, but its flexibility is less needed here', 'Conclusion weighing the fixed requirements against the risk of late testing, perhaps with a test classroom early'],
        model: 'Waterfall suits this project in several ways. The requirements are clear and will not change: 300 PCs must be replaced. The stages must happen in order, because the PCs must arrive before they can be imaged, and imaged before they are installed, which matches Waterfall\'s step by step sequence. The deadline is fixed by the end of the holiday, and Waterfall gives a clear plan with milestones and sign-off at each stage, so the team leader can track progress.\nThe main drawback is that testing comes at the end. If the software image has a fault, it might only be found in the final week, when there is no time to fix 300 PCs. Waterfall also copes badly with surprises, such as a late delivery, because later stages depend on earlier ones. An Agile approach would give earlier feedback, for example by installing one classroom first and asking staff to try it.\nOverall, Waterfall is suitable, because the requirements and order of work are fixed. The team should reduce the late testing risk by testing the image on a few PCs as soon as they arrive.' })
    ]),
    MQ(17, { stem: 'A distribution company is extending its network. It needs to link its office to a second warehouse 300 metres away, and to connect 40 new desks in an area next to heavy machinery. The rest of the office is a quiet, open-plan space. The budget is limited.' }, [
      MP('', { marks: 12, cmd: 'Evaluate', topic: '2.2', levels: true,
        q: 'Evaluate the suitability of fibre-optic, shielded twisted pair (STP) and unshielded twisted pair (UTP) cabling for the company\'s network.',
        ind: ['Fibre-optic: covers 300 metres, which is beyond the 100 metre limit for twisted pair Ethernet', 'Fibre-optic: immune to electrical interference and very fast, but expensive and needs specialist installation', 'STP: shielding reduces interference from the heavy machinery, protecting data near the 40 desks', 'STP: costs more and is stiffer to install than UTP, and limited to 100 metre runs', 'UTP: cheapest and easy to install, suitable for the quiet open-plan office', 'UTP: open to interference, so unsuitable near machinery', 'Cable standards, such as CAT6, affect speed and bandwidth', 'Budget: use the cheaper cable where it is good enough, and the costly cable only where needed', 'Conclusion: fibre between buildings, STP near machinery, UTP in the quiet office'],
        model: 'No single cable suits every part of this network, so each needs judging against its location.\nFibre-optic is the only suitable choice for the link to the warehouse. Twisted pair Ethernet is limited to about 100 metres, so it cannot cover 300 metres without extra equipment, whereas fibre carries data over long distances at high speed. Fibre is also immune to electrical interference. Its drawbacks are cost and the need for specialist installation, but only one link is needed, so the cost is limited.\nNear the heavy machinery, interference could corrupt data on unshielded cable, causing slow or dropped connections. STP has shielding that reduces interference, so it suits the 40 desks there. It costs more than UTP and is stiffer to install, but the cost is justified because reliable connections matter for these workers.\nIn the quiet open-plan office, UTP is the most suitable. It is the cheapest and easiest cable to install, and with no machinery nearby, interference is unlikely to be a problem. Using a standard such as CAT6 would give enough speed for normal office work.\nOverall, the best solution is a mix: fibre for the 300 metre link, STP near the machinery and UTP elsewhere. This spends the limited budget only where the more expensive cables are needed.' })

  /* ---------- written recall ---------- */
  let RC = null;
  const normR = v => ' ' + String(v).toLowerCase().replace(/[\u2018\u2019']/g, '').replace(/\.(?=\s|$)/g, ' ').replace(/[^a-z0-9.]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const hit = (ans, v) => { v = normR(v).trim(); if (!v) return false; return ans.includes(' ' + v + ' ') || ans.includes(' ' + v + 's ') || ans.includes(' ' + v + 'es '); };
  const normF = v => String(v).toUpperCase().replace(/[\u201C\u201D]/g, '"').replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, '').replace(/;/g, ',').replace(/^=/, '');
  function markRecall(it, ans) {
    if (it.t === 'g') { const a = normR(ans); return Math.min(it.groups.filter(g => g.some(v => hit(a, v))).length, it.n); }
    if (it.t === 'n') {
      const nums = (String(ans).match(/-?\d+(\.\d+)?/g) || []).map(Number);
      return it.rule.split(',').some(r => {

        if (r[0] === '=') return nums.some(x => x === v);
        if (r[0] === '<') return nums.some(x => x < v);

      <label class="field"><span>Background tint (when your device is in light mode)</span><select data-a11y="tint">${[['', 'None'], ['cream', 'Cream'], ['blue', 'Pale blue'], ['green', 'Pale green']].map(x => `<option value="${x[0]}"${(A.tint || '') === x[0] ? ' selected' : ''}>${x[1]}</option>`).join('')}</select></label>

      ${canSpeak ? `<h2>Read aloud</h2><p>Use the <b>Read aloud</b> button on questions, flashcards and topic pages. Press it again to stop.</p><label class="field"><span>Reading speed</span><select data-a11y="rate"><option value=""${!A.rate ? ' selected' : ''}>Normal</option><option value="slow"${A.rate === 'slow' ? ' selected' : ''}>Slower</option></select></label><div class="btnrow"><button class="btn" data-act="rdtest">Test the voice</button></div>` : '<h2>Read aloud</h2><p class="small muted">Read aloud is not available in this browser.</p>'}
      <h2>Stamps</h2><label class="chk"><input type="checkbox" data-stamps${P.stamps === false ? '' : ' checked'}><span>Show the Heseltine stamps after tests</span></label>
      <h2>Preview</h2><div class="paper"><p>Phishing tricks people with fake messages. Pharming redirects them to a fake website. Learn one example of each.</p></div></div>`);
  }

  /* ---------- add the read-aloud button to whatever screen is showing ---------- */
  function decorate() {
    if (decorate.busy) return; decorate.busy = true;
    try {
      const wrap = app.querySelector('.wrap'); if (!wrap || wrap.querySelector('.tools')) return;
      const h = location.hash, qb = wrap.querySelector('.qbox');
      let ref = '', snip = '', read = '';
      if (/^#\/quiz\//.test(h) && qb && QZ && QZ.inst) { const t = topicById[QZ.inst.tid], k = t.quiz.indexOf(QZ.inst.q); ref = 'Quiz, topic ' + t.id + (k >= 0 ? ', question ' + (k + 1) : ''); snip = QZ.inst.q.q; read = '.qbox'; }
      else if (/^#\/recall\//.test(h) && qb && RC && RC.items && RC.items[RC.i]) { const c = RC.items[RC.i], k = (RECALL[c.tid] || []).indexOf(c.it); ref = 'Written recall, topic ' + c.tid + (k >= 0 ? ', item ' + (k + 1) : ''); snip = c.it.q; read = '.qbox'; }
      else if (/^#\/(exam|set)\//.test(h) && wrap.querySelector('[data-act="reveal"][data-x]')) { const id = wrap.querySelector('[data-act="reveal"][data-x]').dataset.x; ref = 'Exam question ' + id; snip = (examById[id] || {}).q || ''; read = '.equestion, .qtext, .eq'; }
      else if (/^#\/mock\/\d+\/(q|mark)\/\d+/.test(h) && wrap.querySelector('.equestion')) { const pp = h.split('/'), p = +pp[2], q = mockQs(p)[+pp[4]]; if (q) { ref = MOCKS[p].short + ', question ' + q.n; snip = q.stem || (q.parts[0] || {}).q || ''; read = '.equestion'; } }
      else if (/^#\/flash\//.test(h) && wrap.querySelector('.fcard') && FC && FC.items && FC.items[FC.i]) { const c = FC.items[FC.i]; ref = 'Flashcard, topic ' + c.tid + ': ' + c.f; snip = c.b; read = '.fcard'; }
      else if (/^#\/topic\/[^/]+$/.test(h) && wrap.querySelector('.lede')) { ref = 'Topic ' + h.split('/')[2] + ' knowledge organiser'; read = '.banner h1, .lede, .must'; }
      if (!ref || !canSpeak) return;
      wrap.insertAdjacentHTML('beforeend', `<div class="tools"><button class="btn small" data-act="rdgo" data-read="${esc(read)}" aria-pressed="false">${iconSvg('speaker', 18)}<span class="rl">Read aloud</span></button></div>`);
    } finally { decorate.busy = false; }
  }
  new MutationObserver(decorate).observe(app, { childList: true });

  /* ---------- districts: one shell, a visual style for each area of the portal ---------- */
  const AREA_DISTRICT = { 1: 'blueprint', 2: 'brutal', 3: 'editorial', 4: 'casefile', 5: 'comic', 6: 'poster', 7: 'terminal', 8: 'soc' };
  function districtFor(h) {
    const p = String(h || '').replace(/^#\/?/, '').split('/'), a = p[0] || '';
    const ofTopic = id => { const t = topicById[id]; return t ? AREA_DISTRICT[t.area] : 'transit'; };
    const ofArea = n => AREA_DISTRICT[+n] || 'transit';
    if (a === 'area') return ofArea(p[1]);
    if (a === 'topic') return ofTopic(p[1]);
    if ((a === 'quiz' || a === 'recall') && p[1] === 'topic') return ofTopic(p[2]);
    if ((a === 'quiz' || a === 'recall') && p[1] === 'area') return ofArea(p[2]);
    if (a === 'flash' && p[2] === 'topic') return ofTopic(p[3]);
    if (a === 'flash' && p[2] === 'area') return ofArea(p[3]);
    if (a === 'exam') { const x = examById[p[1]]; return x ? ofTopic(x.topic) : 'transit'; }
    if (a === 'mock') return 'paper';
    return 'transit';
  }
  function networkMap() {
    const x0 = 40, x1 = 348, rows = Object.keys(AREAS).map(Number);
    let o = '<text x="4" y="14" class="nm-p">PAPER 1</text>', yEnd = 0;
    rows.forEach((a, i) => {
      const y = 38 + i * 34 + (a >= 4 ? 16 : 0), ts = topicsIn(a);
      if (a === 4) o += `<text x="4" y="${y - 26}" class="nm-p">PAPER 2</text>`;
      o += `<text x="${x0}" y="${y - 10}" class="nm-l">${esc(AREAS[a].name)}</text><line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--a${a})" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="${y}" r="12" fill="var(--a${a})"/><text x="20" y="${y}" class="nm-n">${a}</text>`;
      ts.forEach((t, k) => {
        const x = ts.length === 1 ? (x0 + x1) / 2 : x0 + 8 + k * ((x1 - x0 - 16) / (ts.length - 1)), b = best(t.id), st = b === null ? 'ns' : b >= 80 ? 'sec' : 'st';
        o += `<a href="#/topic/${t.id}" aria-label="${esc(t.id + ' ' + t.title + (b === null ? ', not started' : ', ' + b + '%'))}"><circle cx="${x.toFixed(1)}" cy="${y}" r="${st === 'sec' ? 7.5 : 6}" class="nm-s ${st}" style="--c: var(--a${a})"/>${st === 'sec' ? `<circle cx="${x.toFixed(1)}" cy="${y}" r="2.6" class="nm-dot"/>` : ''}</a>`;
      });
      yEnd = y;
    });
    const ly = yEnd + 30;
    o += `<circle cx="20" cy="${ly}" r="6" class="nm-s ns" style="--c: var(--muted)"/><text x="32" y="${ly + 4}" class="nm-k">Not started</text><circle cx="122" cy="${ly}" r="6" class="nm-s st" style="--c: var(--muted)"/><text x="134" y="${ly + 4}" class="nm-k">Started</text><circle cx="214" cy="${ly}" r="7.5" class="nm-s sec" style="--c: var(--muted)"/><circle cx="214" cy="${ly}" r="2.6" class="nm-dot"/><text x="227" y="${ly + 4}" class="nm-k">Secure (80%+)</text>`;
    return `<svg viewBox="0 0 360 ${ly + 14}" class="netmap" role="group" aria-label="Revision network: one line for each content area, one station for each topic">${o}</svg>`;
  }

  /* ---------- routing and events ---------- */
  function setNav(a) {
    document.querySelectorAll('.nav a').forEach(l => { if (l.dataset.nav === a) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
  }
  function route() {
    applyA11y();
    document.documentElement.dataset.district = districtFor(location.hash || '#/');
    clearTimer();
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const [a, b, c] = parts;
    setNav(a === 'practice' ? 'practice' : a === 'technique' ? 'technique' : (!a ? 'home' : 'home'));
    if (a === 'quiz') { const s = specFromRoute(b, c); if (!s || !s.items.length) return viewHome(); return startQuiz(s); }
    if (a === 'recall') { const s = recallSpec(b, c); if (!s || !s.items.length) return viewHome(); return startRecall(s); }
    if (a === 'checklist') return viewChecklist(b || 'all', c);
    if (a === 'flash') { if (!b) return viewFlash(); return startFlash(b, c || 'all', parts[3]); }
    if (a === 'planner') return viewPlanner();
    if (a === 'share') return viewShare();
    if (a === 'teacher') { TV = null; return viewTeacher(); }
    if (a === 'examday') return viewExamDay();
    if (a === 'settings') return viewSettings();
    if (a === 'mock') { const mp = +b; if (!MOCKS[mp]) return viewHome(); if (c === 'q') return viewMockQ(mp, +parts[3] || 0, 'answer'); if (c === 'mark') return viewMockQ(mp, +parts[3] || 0, 'mark'); if (c === 'results') return viewMockResults(mp); return viewMockCover(mp); }
    if (a === 'exam') return viewExam(b);
    if (a === 'set') return startSet(b, c);
    if (a === 'paper') return viewPaper(+b);
    if (a === 'area') return viewArea(+b);
    if (a === 'topic') return viewTopic(b, c || 'organiser');
    if (a === 'practice') return viewPractice();
    if (a === 'technique') return viewTechnique(b);
    return viewHome();
  }

  app.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act;
    if (act === 'fcflip' && FC) { FC.flipped = true; renderFlash(); return; }
    if ((act === 'fcyes' || act === 'fcno') && FC) { fcGrade(act === 'fcyes'); return; }
    if (act === 'pswap' || act === 'preplan') { plannerAct(act, el); return; }
    if (['mkcode', 'mkbackup', 'copy', 'restore'].includes(act)) { shareAct(act, el); return; }
    if (act === 'tvgo') { renderTeacher(); return; }
    if (act === 'rdgo' && canSpeak) { readGo(el); return; }
    if (act === 'rdtest' && canSpeak) { speak('This is how the portal sounds when it reads to you.'); return; }
    if (act === 'nostamps') { P.stamps = false; save(); document.querySelectorAll('.stampbox').forEach(b => b.remove()); return; }
    if (act === 'reveal') { el.disabled = true; revealScheme(); logAct('exam'); return; }
    if (act === 'setnext') { EX.i++; if (EX.i >= EX.ids.length) finishSet(); else viewExam(EX.ids[EX.i], true); return; }
    if (act === 'reset') { if (el.dataset.sure) { P = { topic: {}, exam: {}, ans: {}, recall: {}, mock: {}, mockHist: {}, check: {}, fc: {}, act: {}, plan: {}, mdates: {}, me: '', ed: {}, stamps: true, a11y: P.a11y || {} }; save(); viewHome(); } else { el.dataset.sure = '1'; el.textContent = 'Tap again to erase all scores and answers'; } return; }
    if (act === 'rag') { setRag(el.dataset.id, el.dataset.v); return; }
    if (act === 'mstart' || act === 'mfinish' || act === 'mresults') { mockAct(act, +el.dataset.p, el); return; }
    if (act === 'rcheck' && RC && !RC.checked) { recallCheck(); return; }
    if (act === 'rcount' && RC && RC.checked) { RC.got = RC.items[RC.i].it.n; renderRecall(); return; }
    if (act === 'rnext' && RC && RC.checked) { recallNext(); return; }
    if (act === 'rretry' && RC) { const items = RC.missed.map(r => ({ it: r.it, tid: r.tid })); startRecall({ title: RC.title.replace(/ \(retry\)$/, '') + ' (retry)', back: RC.back, items: shuffle(items) }); window.scrollTo(0, 0); return; }
    if (!QZ) return;
    const q = QZ.inst.q;
    if (act === 'opt' && !QZ.checked) {
      const id = el.dataset.id;
      if (q.t === 'mc') QZ.resp = [id];
      else { QZ.resp = QZ.resp.includes(id) ? QZ.resp.filter(x => x !== id) : QZ.resp.concat(id); }
      renderQuiz(); return;
    }
    if (act === 'place' && !QZ.checked) { QZ.resp = QZ.resp.concat(+el.dataset.i); renderQuiz(); return; }
    if (act === 'unplace' && !QZ.checked) { QZ.resp = QZ.resp.filter((_, k) => k !== +el.dataset.k); renderQuiz(); return; }
    if (act === 'check' && !QZ.checked) {
      QZ.lastOk = mark(QZ.inst, QZ.resp); QZ.checked = true;
      QZ.results.push({ tid: QZ.inst.tid, ok: QZ.lastOk, q });
      renderQuiz();
      const fb = $('.fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      return;
    }
    if (act === 'next') {
      if (QZ.i >= QZ.items.length - 1) { finishQuiz(); return; }
      QZ.i++; nextInst(); renderQuiz(); window.scrollTo(0, 0); return;
    }
    if (act === 'retry') {
      const items = QZ.missed.map(r => ({ q: r.q, tid: r.tid }));
      const back = QZ.back, title = QZ.title + ' (retry)';
      startQuiz({ title, back, items: shuffle(items) }); window.scrollTo(0, 0);
    }
  });
  app.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && (el.dataset.ptask || el.dataset.mdate)) { plannerChange(el); return; }
    if (el.dataset && el.dataset.ed) { P.ed[el.dataset.ed] = el.checked; save(); return; }
    if (el.dataset && 'stamps' in el.dataset) { P.stamps = el.checked; save(); return; }
    if (el.dataset && el.dataset.a11y) { P.a11y = P.a11y || {}; P.a11y[el.dataset.a11y] = el.type === 'checkbox' ? el.checked : el.value; save(); applyA11y(); return; }
    if (el.dataset && el.dataset.act === 'match' && QZ && !QZ.checked) {
      QZ.resp[+el.dataset.i] = el.value;
      const chk = $('[data-act="check"]'); if (chk) chk.disabled = !QZ.inst.lefts.every(L => QZ.resp[L.i]);
      return;
    }
    if (el.matches && el.matches('[data-mpt],[data-mlv]')) { mockMarkChange(el); return; }
    if (el.matches && el.matches('[data-rt]') && RC) { RC.eTicks[+el.dataset.rt] = el.checked; return; }
    if (el.matches && el.matches('[data-pt]')) updPts();
    if (el.matches && el.matches('[data-ind],[data-trait]')) updLevel();
    if (el.id === 'lvlmark') { const { x } = window.__examCtx; P.exam[x.id] = { m: +el.value, max: x.marks, t: Date.now() }; save(); }
  });
  app.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset && el.dataset.mans) { const mp = +el.dataset.mans.slice(1, 2); mst(mp).ans[el.dataset.mans] = el.value; save(); const cur = document.querySelector('.qchips a[aria-current]'); if (cur) cur.classList.toggle('done', [...document.querySelectorAll('textarea[data-mans]')].every(t => t.value.trim())); return; }
    if (el.id === 'ef' || el.id === 'ea' || el.id === 'ec') return;
  });
  window.addEventListener('hashchange', route);
  route();

  window.DSS = { districtFor: h => districtFor(h), stampHtml: (a, b, c) => stampHtml(a, b, c), MISTAKES, TOPICS, EXAMQ, AREAS, RECALL, MOCKS, CHECK, LVX, prep, mark, markRecall, shuffle, P: () => P, topicById, FL: { cards, dayNum, weekStart }, SH: { makeCode, readCode, makeBackup, readBackup, summary } };
})();

</script>
</body>
</html>
