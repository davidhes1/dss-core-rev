<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core exam revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@600;700;800&family=Overpass:wght@700;800&family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@700&family=Fraunces:wght@700;800&family=Special+Elite&family=Bangers&family=Anton&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --surface2: #EBEFF7; --ink: #0E1B35; --muted: #52607C; --line: #CFD7E6;
  --accent: #2457D6; --accent-tint: #E3EBFF; --hl: #FFE45C; --hl-ink: #3A2F00;
  --red: #C8222F; --red-tint: #FDE8EA; --green: #11784F; --green-tint: #E1F5EC; --amber: #A25F00; --amber-tint: #FFF1D6;
  --a1: #2457D6; --a2: #0B8480; --a3: #8240BE; --a4: #BE3F08; --a5: #876300; --a6: #B8226A; --a7: #2B7530; --a8: #B8242C;
  --f-head: 'Bricolage Grotesque', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --c1: #D3E2FF; --c2: #C9F2EB; --c3: #E6D8FF; --c4: #FFDCC6; --c5: #FFEFAD; --c6: #FFD3E6; --c7: #CDF3CB; --c1s: #2457D6; --c2s: #0B8480; --c3s: #7C3AED; --c4s: #E2560B; --c5s: #B98C00; --c6s: #D6246E; --c7s: #2E9E44;
  --r1: #C2F0D3; --r2: #FFEC99; --r3: #FFC999; --r4: #FFB3B3; --r1s: #2E9E44; --r2s: #B98C00; --r3s: #E2560B; --r4s: #DC2626;
  --line-d: #0E1B35; --on-hue: #FFFFFF;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1222; --surface: #151D33; --surface2: #1D2742; --ink: #E9EEFB; --muted: #A2AECB; --line: #2E3A5C;
    --accent: #7FA3FF; --accent-tint: #1B2A55; --hl: #FFE45C; --hl-ink: #3A2F00;
    --red: #FF7C86; --red-tint: #3B1B22; --green: #5FD6A2; --green-tint: #123428; --amber: #FFC165; --amber-tint: #382A10;
    --a1: #7FA3FF; --a2: #4CD0CB; --a3: #C197F2; --a4: #FF9A63; --a5: #E8C14A; --a6: #F27DB2; --a7: #7FD083; --a8: #FF8A90;
    --c1: #1D4FD8; --c2: #0B6E67; --c3: #6D32D9; --c4: #B23A0A; --c5: #8F5605; --c6: #BE185D; --c7: #13712F; --c1s: #A5C2FF; --c2s: #7CEBDD; --c3s: #CDBDFF; --c4s: #FFC08A; --c5s: #FDE68A; --c6s: #FBB0D5; --c7s: #95F0B2;
    --r1: #13712F; --r2: #8F5605; --r3: #B23A0A; --r4: #B91C1C; --r1s: #95F0B2; --r2s: #FDE68A; --r3s: #FFC08A; --r4s: #FCA5A5;
    --line-d: #E9EEFB; --on-hue: #0C1222;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1222; --surface: #151D33; --surface2: #1D2742; --ink: #E9EEFB; --muted: #A2AECB; --line: #2E3A5C;
  --accent: #7FA3FF; --accent-tint: #1B2A55; --hl: #FFE45C; --hl-ink: #3A2F00;
  --red: #FF7C86; --red-tint: #3B1B22; --green: #5FD6A2; --green-tint: #123428; --amber: #FFC165; --amber-tint: #382A10;
  --a1: #7FA3FF; --a2: #4CD0CB; --a3: #C197F2; --a4: #FF9A63; --a5: #E8C14A; --a6: #F27DB2; --a7: #7FD083; --a8: #FF8A90;
  --c1: #1D4FD8; --c2: #0B6E67; --c3: #6D32D9; --c4: #B23A0A; --c5: #8F5605; --c6: #BE185D; --c7: #13712F; --c1s: #A5C2FF; --c2s: #7CEBDD; --c3s: #CDBDFF; --c4s: #FFC08A; --c5s: #FDE68A; --c6s: #FBB0D5; --c7s: #95F0B2;
  --r1: #13712F; --r2: #8F5605; --r3: #B23A0A; --r4: #B91C1C; --r1s: #95F0B2; --r2s: #FDE68A; --r3s: #FFC08A; --r4s: #FCA5A5;
  --line-d: #E9EEFB; --on-hue: #0C1222;
  color-scheme: dark;
}
html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 64px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--f-body); -webkit-text-size-adjust: 100%; }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.15; margin: 0 0 .5em; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 7vw, 2.9rem); font-weight: 800; }
h2 { font-size: 1.45rem; font-weight: 700; margin-top: 1.6em; }
h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 780px; margin: 0 auto; padding: 0 16px 56px; }
.muted { color: var(--muted); }
.small { font-size: .9rem; }
.pre { white-space: pre-wrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--ink); }
.topbar .in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; }
.brand { font-family: var(--f-head); font-weight: 800; font-size: .95rem; color: var(--ink); text-decoration: none; margin-right: auto; white-space: nowrap; }
.nav { display: flex; gap: 2px; }
.nav a { color: var(--ink); text-decoration: none; padding: 8px 6px; border-radius: 6px; font-weight: 700; font-size: .9rem; min-height: 44px; display: inline-flex; align-items: center; }
.nav a[aria-current="page"] { background: var(--hl); color: var(--hl-ink); }
.nav a:hover { background: var(--surface2); }
.nav a[aria-current="page"]:hover { background: var(--hl); }

/* crumbs and headings */
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 18px 0 6px; font-size: .95rem; }
.crumbs a { color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border: 2px solid var(--ink); border-radius: 99px; font-size: .85rem; font-weight: 700; background: var(--surface); }
.chip.hue { border-color: var(--hue); color: var(--hue); }
.chip.green { border-color: var(--green); color: var(--green); background: var(--green-tint); }
.chip.amber { border-color: var(--amber); color: var(--amber); background: var(--amber-tint); }
.chip.red { border-color: var(--red); color: var(--red); background: var(--red-tint); }

/* hero */
.hero { padding: 26px 0 10px; }
.hero p { max-width: 34em; font-size: 1.1rem; color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.count { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 8px 14px; display: flex; flex-direction: column; min-width: 150px; }
.count b { font-family: var(--f-head); font-size: 1.7rem; line-height: 1.1; }
.count span { font-size: .9rem; color: var(--muted); }

/* paper panels and mark bar */
.paper { border: 2px solid var(--ink); background: var(--surface); border-radius: 8px; padding: 16px; margin: 16px 0; }
.paper header { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.paper header h2 { margin: 0; font-size: 1.5rem; }
.markbar { display: flex; gap: 4px; height: 70px; margin: 10px 0 14px; }
.seg { --n: 1; flex: var(--n) 1 0; min-width: 34px; position: relative; border: 2px solid var(--hue); border-radius: 6px; background: var(--surface2); overflow: hidden; text-decoration: none; display: block; }
.seg .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--p, 0%); background: var(--hue); opacity: .85; transition: height .5s; }
.seg .n { position: absolute; top: 5px; left: 5px; min-width: 24px; height: 24px; display: grid; place-items: center; background: var(--surface); color: var(--ink); border: 2px solid var(--hue); border-radius: 5px; font-family: var(--f-head); font-weight: 800; font-size: .95rem; padding: 0 4px; }
.seg:hover { transform: translateY(-2px); }
.arealist { list-style: none; margin: 0; padding: 0; }
.arealist li a { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); min-height: 48px; }
.arealist .dot { width: 14px; height: 14px; border-radius: 4px; background: var(--hue); flex: none; }
.arealist .nm { flex: 1; font-weight: 700; }
.arealist .pc { font-variant-numeric: tabular-nums; color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 8px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 700; text-decoration: none; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.hl { background: var(--hl); color: var(--hl-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 40px; padding: 6px 12px; font-size: .95rem; }

/* action tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 16px 0; }
.tile { display: block; text-decoration: none; color: var(--ink); border: 2px solid var(--ink); border-radius: 8px; padding: 14px; background: var(--surface); }
.tile b { display: block; font-family: var(--f-head); font-size: 1.15rem; margin-bottom: 2px; }
.tile span { color: var(--muted); font-size: .95rem; }
.tile:hover { background: var(--hl); color: var(--hl-ink); }
.tile:hover span { color: var(--hl-ink); }

/* search */
.search { width: 100%; min-height: 50px; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.results { list-style: none; margin: 8px 0 0; padding: 0; }
.results a { display: flex; gap: 10px; padding: 10px 4px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); min-height: 46px; align-items: center; }
.tid { font-family: var(--f-head); font-weight: 800; min-width: 3.2em; color: var(--hue, var(--accent)); }

/* topic rows */
.toplist { list-style: none; margin: 10px 0; padding: 0; }
.toplist li a { display: flex; align-items: center; gap: 12px; padding: 12px 10px; border: 2px solid var(--line); border-left: 6px solid var(--hue); border-radius: 6px; margin-bottom: 8px; background: var(--surface); text-decoration: none; color: var(--ink); min-height: 56px; }
.toplist li a:hover { border-color: var(--ink); border-left-color: var(--hue); }
.toplist .tt { flex: 1; font-weight: 700; }
.toplist .sub { display: block; font-weight: 400; font-size: .88rem; color: var(--muted); }

/* tabs */
.tabs { display: flex; border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; margin: 14px 0; background: var(--surface); }
.tabs a { flex: 1; text-align: center; padding: 11px 3px; font-size: .95rem; text-decoration: none; color: var(--ink); font-weight: 700; border-right: 2px solid var(--ink); min-height: 46px; }
.tabs a:last-child { border-right: 0; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* organiser */
.lede { font-size: 1.15rem; border-left: 6px solid var(--hue); padding: 4px 0 4px 14px; margin: 14px 0 18px; }
.diagwrap { background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 10px; margin: 14px 0; display: flex; justify-content: center; }
.diagram { width: 100%; max-width: 420px; height: auto; }
.terms { margin: 0; }
.terms div { display: grid; grid-template-columns: minmax(7.5em, 28%) 1fr; gap: 4px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.terms dt { font-weight: 700; color: var(--hue); }
.terms dd { margin: 0; }
@media (max-width: 520px) { .terms div { grid-template-columns: 1fr; } }
.must { padding-left: 1.1em; }
.must li { margin-bottom: .45em; }
.tip { background: var(--hl); color: var(--hl-ink); border-radius: 8px; padding: 12px 14px; margin: 18px 0; }
.tip b { font-family: var(--f-head); }

/* quiz */
.qhead { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; font-weight: 700; }
.bar { flex: 1; height: 12px; background: var(--surface2); border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width .3s; }
.qbox { background: var(--surface); border: 2px solid var(--ink); border-radius: 8px; padding: 16px; margin: 8px 0; }
.qtext { font-size: 1.12rem; font-weight: 700; margin-bottom: 14px; white-space: pre-wrap; }
.hint { color: var(--muted); font-size: .92rem; margin: -6px 0 12px; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; padding: 12px 14px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 54px; }
.opt .k { flex: none; width: 28px; height: 28px; border: 2px solid var(--ink); border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: .9rem; background: var(--surface); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-tint); }
.opt[aria-pressed="true"] .k { background: var(--accent); color: #fff; border-color: var(--accent); }
.opt.right { border-color: var(--green); background: var(--green-tint); }
.opt.wrong { border-color: var(--red); background: var(--red-tint); }
.opt.right .k { background: var(--green); color: #fff; border-color: var(--green); }
.opt.wrong .k { background: var(--red); color: #fff; border-color: var(--red); }
.opt.missed { border-style: dashed; border-color: var(--green); }
.opt[disabled] { cursor: default; }
.slots { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: s; display: grid; gap: 8px; }
.slots li { counter-increment: s; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 8px 12px; border: 2px dashed var(--line); border-radius: 8px; }
.slots li::before { content: counter(s); font-family: var(--f-head); font-weight: 800; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--surface2); flex: none; }
.slots li.filled { border: 2px solid var(--accent); background: var(--accent-tint); }
.slots li.ok { border-color: var(--green); background: var(--green-tint); }
.slots li.no { border-color: var(--red); background: var(--red-tint); }
.slots li button { flex: 1; text-align: left; background: none; border: 0; padding: 4px 0; min-height: 40px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { padding: 10px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); min-height: 46px; text-align: left; }
.chipbtn:hover { background: var(--hl); color: var(--hl-ink); }
.matchrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.matchrow select { width: 100%; min-height: 48px; padding: 8px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.matchrow.ok select { border-color: var(--green); background: var(--green-tint); }
.matchrow.no select { border-color: var(--red); background: var(--red-tint); }
.matchrow .ans { grid-column: 1 / -1; font-size: .92rem; color: var(--green); }
@media (max-width: 520px) { .matchrow { grid-template-columns: 1fr; } }
.fb { margin-top: 14px; border-radius: 8px; padding: 12px 14px; border: 2px solid; display: flex; gap: 12px; align-items: flex-start; }
.fb.good { border-color: var(--green); background: var(--green-tint); }
.fb.bad { border-color: var(--red); background: var(--red-tint); }
.fb b { display: block; font-family: var(--f-head); font-size: 1.1rem; }
.pen { width: 34px; height: 34px; flex: none; fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s ease-out forwards; }
.pen.t { stroke: var(--green); }
.pen.x { stroke: var(--red); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .pen { animation: none; stroke-dashoffset: 0; } .bar i, .seg .fill { transition: none; } .seg:hover { transform: none; } }
.score { font-family: var(--f-head); font-size: 3.2rem; font-weight: 800; line-height: 1; }
.missed-list { list-style: none; padding: 0; margin: 0; }
.missed-list li { padding: 12px 0; border-top: 1px solid var(--line); }
.lvl { font-size: .82rem; font-weight: 700; padding: 1px 8px; border-radius: 99px; border: 2px solid var(--line); color: var(--muted); }

/* exam */
.markbox { display: inline-block; border: 2px solid var(--ink); border-radius: 4px; padding: 0 10px; font-family: var(--f-head); font-weight: 800; background: var(--surface); }
.cmd { background: var(--hl); color: var(--hl-ink); padding: 0 6px; border-radius: 3px; font-weight: 800; }
.equestion { background: var(--surface); border: 2px solid var(--ink); border-radius: 8px; padding: 16px; margin: 10px 0; }
.equestion .qt { white-space: pre-wrap; font-size: 1.08rem; margin: 10px 0 0; }
textarea.ans { width: 100%; min-height: 220px; padding: 12px; border: 2px solid var(--ink); border-radius: 8px; font: inherit; line-height: 1.6; background: var(--surface); color: var(--ink); resize: vertical; background-image: repeating-linear-gradient(transparent, transparent 1.55em, var(--line) 1.55em, var(--line) calc(1.55em + 1px)); background-attachment: local; }
.scheme { border: 2px solid var(--green); background: var(--green-tint); border-radius: 8px; padding: 14px; margin: 14px 0; }
.scheme h3 { margin-top: 0; }
.chk { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); min-height: 48px; cursor: pointer; }
.chk input { width: 26px; height: 26px; flex: none; margin-top: 2px; accent-color: var(--green); }
.total { font-family: var(--f-head); font-size: 1.5rem; font-weight: 800; }
.model { background: var(--surface); border: 2px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
details > summary { cursor: pointer; font-weight: 700; padding: 10px 0; min-height: 44px; }
.bands { width: 100%; border-collapse: collapse; margin: 8px 0; }
.bands th, .bands td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
.bands th { background: var(--surface2); }
select.mk { min-height: 46px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.timer { font-variant-numeric: tabular-nums; font-family: var(--f-head); font-weight: 800; }

/* technique */
.cmdcard { border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); margin-bottom: 8px; padding: 0 14px; }
.cmdcard summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cmdcard summary .w { font-family: var(--f-head); font-weight: 800; flex: 1; min-width: 12em; }
.cmdcard dl { margin: 0 0 10px; }
.cmdcard dt { font-weight: 700; margin-top: 8px; color: var(--accent); }
.cmdcard dd { margin: 0; }
.aobar { display: flex; height: 40px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; margin: 6px 0; }
.aobar span { display: grid; place-items: center; font-weight: 800; font-size: .9rem; color: var(--on-hue); padding: 0 4px; overflow: hidden; white-space: nowrap; }
.tbl-wrap { overflow-x: auto; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); }
table.sam { width: 100%; border-collapse: collapse; min-width: 560px; }
table.sam th, table.sam td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
table.sam th { background: var(--surface2); position: sticky; top: 0; }
.field { display: block; margin: 12px 0; }
.field span { display: block; font-weight: 700; margin-bottom: 4px; }
.field textarea, .field input { width: 100%; padding: 10px; border: 2px solid var(--ink); border-radius: 8px; font: inherit; background: var(--surface); color: var(--ink); }
.preview { background: var(--hl); color: var(--hl-ink); border-radius: 8px; padding: 12px 14px; min-height: 3em; }
.foot { margin-top: 40px; padding-top: 16px; border-top: 2px solid var(--ink); font-size: .9rem; color: var(--muted); }

/* shared shell: graphite top bar with the district's accent stripe */
:root[data-district] .topbar { background: #15171D; border-bottom: 3px solid var(--d-bar, #DC241F); }
:root[data-district] .topbar .brand { color: #FFFFFF; }
:root[data-district] .nav a { color: #E9EBEF; }
:root[data-district] .nav a:hover { background: rgba(255, 255, 255, .1); }
:root[data-district] .nav a[aria-current="page"] { background: #FFD329; color: #15171D; }
:root[data-district] .nav .aa { border-color: rgba(255, 255, 255, .45); }

/* TRANSIT MAP: home, planner, checklist, flashcards */
:root[data-district="transit"] .banner { background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-left: 12px solid var(--hue, var(--accent)); border-radius: 6px; }
:root[data-district="transit"] .banner .bi { width: 46px; height: 46px; border-radius: 50%; border: 6px solid var(--hue, var(--accent)); display: grid; place-items: center; box-sizing: border-box; }
:root[data-district="transit"] .hero2 { background: #15171D; padding-bottom: 30px; }
:root[data-district="transit"] .hero2::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 9px; background: linear-gradient(90deg, #2457D6 0 12.5%, #0B8480 12.5% 25%, #8240BE 25% 37.5%, #BE3F08 37.5% 50%, #C99A00 50% 62.5%, #B8226A 62.5% 75%, #2B7530 75% 87.5%, #B8242C 87.5% 100%); }
:root[data-district="transit"] .hero2 .cd { background: #0B0C10; border-color: #30333B; }
:root[data-district="transit"] .hero2 .cd b { font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #FFB000; }
:root[data-district="transit"] .hero2 .kick { color: #FFD329; }
.netmap { width: 100%; max-width: 560px; height: auto; display: block; margin: 6px auto 4px; }
.netmap .nm-l { font: 700 11px var(--f-body); fill: var(--ink); }
.netmap .nm-p { font: 800 12px var(--f-head); fill: var(--muted); letter-spacing: .06em; }
.netmap .nm-n { font: 800 12px var(--f-body); fill: var(--on-hue); text-anchor: middle; dominant-baseline: central; }
.netmap .nm-s { stroke: var(--c); stroke-width: 3; fill: var(--surface); }
.netmap .nm-s.st, .netmap .nm-s.sec { fill: var(--c); }
.netmap .nm-dot { fill: var(--surface); pointer-events: none; }
.netmap a:focus-visible .nm-s { stroke: var(--ink); stroke-width: 4; }
.netmap .nm-k { font: 400 11px var(--f-body); fill: var(--muted); }

/* district previews on the home page area tiles */
.atile.dist-blueprint { background-color: #0E3576; background-image: linear-gradient(rgba(255,255,255,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.12) 1px, transparent 1px); background-size: 16px 16px; color: #F3F8FF; border-radius: 2px; }
.atile.dist-brutal { background: #FFD60A; color: #111111; border: 3px solid #111111; border-radius: 0; box-shadow: 5px 5px 0 #111111; }
.atile.dist-editorial { background: #FAF7F0; color: #1A1714; border-top: 6px double #1A1714; border-radius: 0; }
.atile.dist-casefile { background: #F3E3B5; color: #2A2016; border-radius: 0 12px 12px 12px; }
.atile.dist-comic { background-color: #FFE14D; background-image: radial-gradient(rgba(0,0,0,.16) 1px, transparent 1.5px); background-size: 8px 8px; color: #111111; border: 3px solid #111111; border-radius: 6px; }
.atile.dist-poster { background-color: #C43300; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 12px, transparent 12px 24px); color: #FFF7EE; border-radius: 0; }
.atile.dist-terminal { background: #050A06; color: #B8FFC6; border: 1px solid #3DFF73; border-radius: 0; }
.atile.dist-soc { background-color: #111827; background-image: linear-gradient(135deg, #111827, #18223A); color: #E6EDF7; border-top: 4px solid #F59E0B; border-radius: 6px; }
.atile.dist-blueprint .tab { background: #0E3576; color: #F3F8FF; } .atile.dist-brutal .tab { background: #111111; color: #FFD60A; }
.atile.dist-editorial .tab { background: #1A1714; color: #FAF7F0; } .atile.dist-casefile .tab { background: #F3E3B5; color: #2A2016; }
.atile.dist-comic .tab { background: #111111; color: #FFE14D; } .atile.dist-poster .tab { background: #1B0C30; color: #FFF0DE; }
.atile.dist-terminal .tab { background: #3DFF73; color: #031006; } .atile.dist-soc .tab { background: #F59E0B; color: #0A0E18; }
.atile.dist-blueprint b, .atile.dist-soc b { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
.atile.dist-brutal b { font-family: 'Space Grotesk', var(--f-body); } .atile.dist-editorial b { font-family: 'Fraunces', Georgia, serif; }
.atile.dist-casefile b { font-family: 'Special Elite', 'Courier New', monospace; font-weight: 400; } .atile.dist-comic b { font-family: 'Bangers', var(--f-body); font-weight: 400; letter-spacing: .04em; font-size: 1.25rem; }
.atile.dist-poster b { font-family: 'Anton', 'Arial Narrow', sans-serif; font-weight: 400; text-transform: uppercase; font-size: 1.2rem; } .atile.dist-terminal b { font-family: 'VT323', ui-monospace, monospace; font-weight: 400; font-size: 1.28rem; }

/* BLUEPRINT: Area 1 */
:root[data-district="blueprint"] body { background-image: linear-gradient(rgba(255,255,255,.11) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.11) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px, 48px 48px, 12px 12px, 12px 12px; }
:root[data-district="blueprint"] h1, :root[data-district="blueprint"] h2, :root[data-district="blueprint"] h3 { text-transform: uppercase; letter-spacing: .03em; }
:root[data-district="blueprint"] .banner { background: var(--bg); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; box-shadow: inset 0 0 0 5px var(--bg), inset 0 0 0 6px var(--ink); }
:root[data-district="blueprint"] .paper, :root[data-district="blueprint"] .toplist li a, :root[data-district="blueprint"] .stat, :root[data-district="blueprint"] .tabs, :root[data-district="blueprint"] .btn, :root[data-district="blueprint"] .diagwrap, :root[data-district="blueprint"] .qbox, :root[data-district="blueprint"] .opt, :root[data-district="blueprint"] .tip { border-radius: 0; }

/* NEO-BRUTALIST: Area 2 */
:root[data-district="brutal"] .banner { background: var(--hl); color: #111111; border: 3px solid var(--line); border-radius: 0; box-shadow: 6px 6px 0 var(--line); }
:root[data-district="brutal"] .paper, :root[data-district="brutal"] .toplist li a, :root[data-district="brutal"] .stat, :root[data-district="brutal"] .tabs, :root[data-district="brutal"] .diagwrap, :root[data-district="brutal"] .qbox { border: 3px solid var(--line); border-radius: 0; box-shadow: 5px 5px 0 var(--line); }
:root[data-district="brutal"] .btn { border: 3px solid var(--line); border-radius: 0; box-shadow: 4px 4px 0 var(--line); }
:root[data-district="brutal"] .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--line); }
:root[data-district="brutal"] .opt { border-radius: 0; border-width: 3px; }
:root[data-district="brutal"] h1, :root[data-district="brutal"] h2 { letter-spacing: -0.02em; }
:root[data-district="brutal"] .terms div { border-top: 2px solid var(--line); }

/* EDITORIAL: Area 3 */
:root[data-district="editorial"] .banner { background: transparent; color: var(--ink); border-top: 5px double var(--ink); border-bottom: 1px solid var(--ink); border-radius: 0; padding-left: 2px; padding-right: 2px; }
:root[data-district="editorial"] .banner .bk { text-transform: uppercase; letter-spacing: .12em; color: var(--accent); font-size: .78rem; }
:root[data-district="editorial"] .banner .bi { color: var(--accent); }
:root[data-district="editorial"] .lede { border-left: 0; padding-left: 0; font-family: 'Fraunces', Georgia, serif; font-size: 1.22rem; }
:root[data-district="editorial"] .lede::first-letter { float: left; font-size: 3.1em; line-height: .82; padding: 6px 8px 0 0; color: var(--accent); font-weight: 800; }
:root[data-district="editorial"] h2 { border-top: 1px solid var(--ink); padding-top: 8px; }
:root[data-district="editorial"] .paper, :root[data-district="editorial"] .toplist li a, :root[data-district="editorial"] .stat, :root[data-district="editorial"] .tabs, :root[data-district="editorial"] .btn, :root[data-district="editorial"] .diagwrap, :root[data-district="editorial"] .qbox, :root[data-district="editorial"] .opt { border-radius: 2px; }

/* CASE FILE: Area 4 */
:root[data-district="casefile"] body { background-image: radial-gradient(rgba(70, 45, 10, .10) 1px, transparent 1.5px); background-size: 6px 6px; }
:root[data-district="casefile"] .banner { background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 0 8px 8px 8px; position: relative; margin-top: 30px; }
:root[data-district="casefile"] .banner::before { content: 'CASE FILE'; position: absolute; left: -2px; top: -26px; padding: 3px 14px; background: var(--surface); border: 2px solid var(--line); border-bottom: 0; border-radius: 8px 8px 0 0; font-family: 'Special Elite', 'Courier New', monospace; font-size: .82rem; color: var(--ink); }
:root[data-district="casefile"] .banner::after { content: 'REVISE'; position: absolute; right: 10px; top: -24px; transform: rotate(-7deg); border: 3px solid var(--accent); color: var(--accent); padding: 0 8px; font-family: 'Special Elite', 'Courier New', monospace; font-size: .85rem; letter-spacing: .12em; background: var(--surface); }
:root[data-district="casefile"] .terms dt, :root[data-district="casefile"] .tabs a { font-family: 'Special Elite', 'Courier New', monospace; }
:root[data-district="casefile"] .paper, :root[data-district="casefile"] .toplist li a, :root[data-district="casefile"] .stat, :root[data-district="casefile"] .diagwrap, :root[data-district="casefile"] .qbox, :root[data-district="casefile"] .opt { border-radius: 2px; }

/* COMIC STORYBOARD: Area 5 */
:root[data-district="comic"] body { background-image: radial-gradient(rgba(0, 0, 0, .09) 1.1px, transparent 1.6px); background-size: 9px 9px; }
:root[data-district="comic"] h1, :root[data-district="comic"] h2, :root[data-district="comic"] h3 { font-weight: 400; letter-spacing: .04em; }
:root[data-district="comic"] h1 { font-size: clamp(2.3rem, 9vw, 3.3rem); }
:root[data-district="comic"] h2 { display: inline-block; background: var(--hl); color: #111111; padding: 2px 10px; border: 2px solid var(--line); transform: rotate(-1deg); }
:root[data-district="comic"] .banner { background: var(--hl); color: #111111; border: 3px solid var(--line); border-radius: 6px; box-shadow: 5px 5px 0 var(--line); }
:root[data-district="comic"] .paper, :root[data-district="comic"] .toplist li a, :root[data-district="comic"] .stat, :root[data-district="comic"] .tabs, :root[data-district="comic"] .diagwrap, :root[data-district="comic"] .qbox, :root[data-district="comic"] .btn, :root[data-district="comic"] .opt { border-width: 3px; border-color: var(--line); border-radius: 6px; }

/* POSTER: Area 6 */
:root[data-district="poster"] h1, :root[data-district="poster"] h2, :root[data-district="poster"] h3 { text-transform: uppercase; font-weight: 400; letter-spacing: .01em; }
:root[data-district="poster"] h1 { font-size: clamp(2.4rem, 10vw, 3.6rem); }
:root[data-district="poster"] .banner { background-color: #C43300; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.12) 0 14px, transparent 14px 28px); color: #FFF7EE; border-radius: 0; }
:root[data-district="poster"] .paper, :root[data-district="poster"] .toplist li a, :root[data-district="poster"] .stat, :root[data-district="poster"] .tabs, :root[data-district="poster"] .btn, :root[data-district="poster"] .diagwrap, :root[data-district="poster"] .qbox, :root[data-district="poster"] .opt { border-radius: 0; border-width: 3px; }
:root[data-district="poster"] .lede { border-left-width: 10px; font-weight: 700; }

/* RETRO TERMINAL: Area 7 */
:root[data-district="terminal"] body { background-image: repeating-linear-gradient(0deg, rgba(61, 255, 115, .035) 0 1px, transparent 1px 3px); }
:root[data-district="terminal"] h1, :root[data-district="terminal"] h2, :root[data-district="terminal"] h3 { font-weight: 400; letter-spacing: .02em; }
:root[data-district="terminal"] h1 { font-size: clamp(2.6rem, 10vw, 3.6rem); }
:root[data-district="terminal"] h2 { font-size: 1.9rem; }
:root[data-district="terminal"] .banner { background: var(--surface); color: var(--ink); border: 1px solid var(--accent); border-radius: 0; box-shadow: 0 0 18px rgba(61, 255, 115, .18); }
:root[data-district="terminal"] .banner h1::before { content: '> '; color: var(--accent); }
:root[data-district="terminal"] .banner h1::after { content: '_'; color: var(--accent); animation: d-blink 1.1s steps(1) infinite; }
@keyframes d-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { :root[data-district="terminal"] .banner h1::after { animation: none; } }
:root[data-district="terminal"] .btn, :root[data-district="terminal"] .tabs a, :root[data-district="terminal"] .chip, :root[data-district="terminal"] .crumbs { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
:root[data-district="terminal"] .tip { background: var(--surface2); color: var(--ink); border: 1px dashed var(--accent); }
:root[data-district="terminal"] .paper, :root[data-district="terminal"] .toplist li a, :root[data-district="terminal"] .stat, :root[data-district="terminal"] .tabs, :root[data-district="terminal"] .btn, :root[data-district="terminal"] .diagwrap, :root[data-district="terminal"] .tip, :root[data-district="terminal"] .chip, :root[data-district="terminal"] .qbox, :root[data-district="terminal"] .opt { border-radius: 0; }

/* SOC DASHBOARD: Area 8 */
:root[data-district="soc"] body { background-image: radial-gradient(circle at 15% 0%, rgba(34, 211, 238, .09), transparent 45%), linear-gradient(rgba(255, 255, 255, .025) 1px, transparent 1px); background-size: auto, 100% 32px; }
:root[data-district="soc"] h2 { text-transform: uppercase; font-size: 1.12rem; letter-spacing: .08em; color: var(--accent); }
:root[data-district="soc"] .banner { background-color: #111827; background-image: linear-gradient(135deg, #111827, #1B2742); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--hl); border-radius: 6px; }
:root[data-district="soc"] .paper, :root[data-district="soc"] .stat, :root[data-district="soc"] .diagwrap, :root[data-district="soc"] .qbox { border: 1px solid var(--line); border-radius: 6px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04); }
:root[data-district="soc"] .toplist li a { border-left: 4px solid var(--hue); }

/* EXAM PAPER: mocks */
:root[data-district="paper"] .paper { border-radius: 0; }

/* key-term names: dark text with a coloured underline where the area colour is too faint on the background */
:root[data-district="brutal"] .terms dt, :root[data-district="casefile"] .terms dt { color: var(--ink); text-decoration: underline 3px var(--hue); text-underline-offset: 4px; }
@media (prefers-color-scheme: light) { :root[data-district="casefile"]:not([data-theme="dark"]) { --amber: #8A5000; } }
.banner h1 { overflow-wrap: break-word; min-width: 0; }
:root[data-district="poster"] .banner h1 { font-size: clamp(1.7rem, 7.6vw, 2.6rem); }
:root[data-district="terminal"] .banner h1 { font-size: clamp(2rem, 9vw, 2.9rem); }
:root[data-district="comic"] .banner h1 { font-size: clamp(1.8rem, 8vw, 2.7rem); }
.atile b { overflow-wrap: break-word; min-width: 0; }

</style>

<body>
<header class="topbar"><div class="in"><a class="brand" href="#/">Core revision</a>
<nav class="nav" aria-label="Main"><a href="#/" data-nav="home" aria-current="page">Home</a><a href="#/practice" data-nav="practice">Practice</a><a href="#/technique" data-nav="technique">Technique</a><a href="#/settings" data-nav="settings" class="aa" aria-label="Reading and display options">Aa</a></nav></div></header>
<main id="app" aria-live="off"></main>
<script>
/* ===== Content helpers (question constructors) ===== */
const TOPICS = [];   // filled by data files
const EXAMQ = [];    // filled by exam files

// Multiple choice, exactly one right answer. wrong = array of distractors.
const mc = (q, right, wrong, exp, lvl = 1) => ({ t: 'mc', q, right: [right], wrong, exp, lvl });
// Multi-select, several right answers.
const ms = (q, rights, wrongs, exp, lvl = 2) => ({ t: 'ms', q, right: rights, wrong: wrongs, exp, lvl });
// Put in order.
const ord = (q, steps, exp, lvl = 2) => ({ t: 'ord', q, steps, exp, lvl });
// Match pairs [left, right].
const mt = (q, pairs, exp, lvl = 2) => ({ t: 'mt', q, pairs, exp, lvl });

// Topic: id, title, paper, area, organiser, quiz
function T(id, title, org, quiz) {
  const area = parseInt(id.split('.')[0], 10);
  TOPICS.push({ id, title, area, paper: area <= 3 ? 1 : 2, org, quiz });
}
// Exam question
function X(o) { EXAMQ.push(o); }

const AREAS = {
  1: { name: 'Problem solving', paper: 1, hue: 'a1' },
  2: { name: 'Introduction to digital support', paper: 1, hue: 'a2' },
  3: { name: 'Data', paper: 1, hue: 'a3' },
  4: { name: 'Legislation and regulatory requirements', paper: 2, hue: 'a4' },
  5: { name: 'Business context', paper: 2, hue: 'a5' },
  6: { name: 'Emerging issues', paper: 2, hue: 'a6' },
  7: { name: 'Digital environments', paper: 2, hue: 'a7' },
  8: { name: 'Security', paper: 2, hue: 'a8' }
};

/* ===== SVG diagram generators. Colours come from CSS classes so dark mode works. ===== */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const DEFS = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrow"/></marker></defs>';
const svg = (w, h, inner, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" class="diagram">${DEFS}${inner}</svg>`;

// wrap a label to fit a box (only when the label has no explicit line breaks)
function wrap(s, max) {
  s = String(s);
  if (s.indexOf('\n') >= 0) return s;
  const words = s.split(' '), lines = [];
  let cur = '';
  words.forEach(w => {
    if (cur && (cur + ' ' + w).length > max) { lines.push(cur); cur = w; } else { cur = cur ? cur + ' ' + w : w; }
  });
  if (cur) lines.push(cur);
  return lines.join('\n');
}
// multi-line text centred at x,y
function txt(x, y, s, cls = 'd-t', lh = 15) {
  const lines = String(s).split('\n');
  const y0 = y - ((lines.length - 1) * lh) / 2;
  return `<text x="${x}" y="${y0}" class="${cls}" text-anchor="middle" dominant-baseline="middle">` +
    lines.map((l, i) => `<tspan x="${x}" dy="${i === 0 ? 0 : lh}">${esc(l)}</tspan>`).join('') + '</text>';
}
const rect = (x, y, w, h, s, cls = 'c1', r = 8) => {
  const small = w < 90, lh = small ? 13 : 15;
  const max = Math.max(4, Math.floor((w - 10) / (small ? 6.2 : 7.2)));
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="d-box ${cls}"/>` + txt(x + w / 2, y + h / 2, wrap(s, max), small ? 'd-t d-small' : 'd-t', lh);
};
const arrow = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="d-line" marker-end="url(#ah)"/>`;
const path = (d, extra = '') => `<path d="${d}" class="d-line d-nofill" marker-end="url(#ah)" ${extra}/>`;

const DIAG = {};

// Circular cycle of N labelled boxes with arrows between them.
DIAG.cycle = (labels, centre = '', opts = {}) => {
  const w = opts.w || 360, h = opts.h || 320, n = labels.length;
  const cx = w / 2, cy = h / 2, rx = w / 2 - (opts.bw || 62), ry = h / 2 - 30, bw = opts.bw ? opts.bw * 2 : 118, bh = 38;
  let out = '', boxes = '';
  const ang = i => (-90 + (360 / n) * i) * Math.PI / 180;
  const off = opts.off || (n <= 4 ? 30 : n === 5 ? 25 : 22);
  for (let i = 0; i < n; i++) {
    const a1 = ang(i) + off * Math.PI / 180 * 1, a2 = ang(i + 1) - off * Math.PI / 180;
    const x1 = cx + rx * Math.cos(a1), y1 = cy + ry * Math.sin(a1), x2 = cx + rx * Math.cos(a2), y2 = cy + ry * Math.sin(a2);
    out += path(`M${x1.toFixed(1)} ${y1.toFixed(1)} A${rx} ${ry} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`);
    const bx = cx + rx * Math.cos(ang(i)) - bw / 2, by = cy + ry * Math.sin(ang(i)) - bh / 2;
    boxes += rect(bx, by, bw, bh, labels[i], 'c' + ((i % 6) + 1));
  }
  if (centre) out += txt(cx, cy, centre, 'd-t d-muted');
  return svg(w, h, out + boxes, opts.label || 'Cycle diagram: ' + labels.join(', '));
};

// Vertical or horizontal chain of boxes.
DIAG.chain = (steps, opts = {}) => {
  const horiz = !!opts.horiz, n = steps.length;
  if (horiz) {
    const bw = opts.bw || 92, gap = 22, bh = opts.bh || 54, w = n * bw + (n - 1) * gap + 20, h = bh + 20;
    let out = '';
    steps.forEach((s, i) => {
      const x = 10 + i * (bw + gap);
      out += rect(x, 10, bw, bh, s, 'c' + ((i % 6) + 1));
      if (i < n - 1) out += arrow(x + bw + 2, 10 + bh / 2, x + bw + gap - 2, 10 + bh / 2);
    });
    return svg(w, h, out, opts.label || 'Process: ' + steps.join(' then '));
  }
  const bw = opts.bw || 250, bh = opts.bh || 36, gap = 20, w = bw + 20, h = n * bh + (n - 1) * gap + 20;
  let out = '';
  steps.forEach((s, i) => {
    const y = 10 + i * (bh + gap);
    out += rect(10, y, bw, bh, s, 'c' + ((i % 6) + 1));
    if (i < n - 1) out += arrow(10 + bw / 2, y + bh + 1, 10 + bw / 2, y + bh + gap - 1);
  });
  return svg(w, h, out, opts.label || 'Process: ' + steps.join(' then '));
};

// Layer stack: layers = [{t, n}] top to bottom.
DIAG.stack = (layers, opts = {}) => {
  const w = opts.w || 360, lh = opts.lh || 40, gap = 4, h = layers.length * (lh + gap) + 8;
  let out = '';
  layers.forEach((l, i) => {
    const y = 4 + i * (lh + gap);
    out += `<rect x="6" y="${y}" width="${w - 12}" height="${lh}" rx="6" class="d-box c${(i % 7) + 1}"/>`;
    out += `<text x="16" y="${y + lh / 2}" class="d-t d-b" dominant-baseline="middle">${esc(l.t)}</text>`;
    if (l.n) out += `<text x="${w - 16}" y="${y + lh / 2}" class="d-t d-small" text-anchor="end" dominant-baseline="middle">${esc(l.n)}</text>`;
  });
  return svg(w, h, out, opts.label || 'Layers: ' + layers.map(l => l.t).join(', '));
};

// 5x5 risk matrix.
DIAG.matrix = () => {
  const L = ['Improbable', 'Remote', 'Occasional', 'Probable', 'Frequent'];
  const S = ['Negligible', 'Marginal', 'Moderate', 'Critical', 'Catastrophic'];
  const x0 = 92, y0 = 8, cw = 50, ch = 38, w = x0 + 5 * cw + 52, h = y0 + 5 * ch + 92;
  let out = '';
  for (let r = 0; r < 5; r++) {            // r=0 top = severity 5
    const sev = 5 - r;
    out += `<text x="${x0 - 6}" y="${y0 + r * ch + ch / 2}" class="d-t d-small" text-anchor="end" dominant-baseline="middle">${S[sev - 1]}</text>`;
    for (let c = 0; c < 5; c++) {
      const sc = sev * (c + 1), k = sc <= 4 ? 'r1' : sc <= 9 ? 'r2' : sc <= 16 ? 'r3' : 'r4';
      out += `<rect x="${x0 + c * cw}" y="${y0 + r * ch}" width="${cw - 2}" height="${ch - 2}" rx="4" class="d-box ${k}"/>` + txt(x0 + c * cw + cw / 2 - 1, y0 + r * ch + ch / 2 - 1, sc);
    }
  }
  for (let c = 0; c < 5; c++) out += `<text transform="translate(${x0 + c * cw + cw / 2 + 4} ${y0 + 5 * ch + 6}) rotate(40)" class="d-t d-small">${L[c]}</text>`;
  out += `<text x="${x0 + 2.5 * cw}" y="${h - 6}" class="d-t d-b" text-anchor="middle">Likelihood (across)</text>`;
  out += `<text x="10" y="${h - 6}" class="d-t d-b">Severity (up)</text>`;
  return svg(w, h, out, 'Five by five risk matrix. Risk score equals likelihood multiplied by severity.');
};

// CIA triad
DIAG.cia = () => {
  const node = (x, y, t, c) => `<rect x="${x - 70}" y="${y - 20}" width="140" height="40" rx="20" class="d-box ${c}"/>` + txt(x, y, t, 'd-t d-b');
  const out = `<polygon points="180,40 78,236 282,236" class="d-box c6" style="fill-opacity:.28"/>` + node(180, 30, 'Confidentiality', 'c1') + node(78, 244, 'Integrity', 'c3') + node(282, 244, 'Availability', 'c2') +
    txt(180, 118, 'Keep data private\nby controlling access', 'd-t d-small') + txt(84, 160, 'Confidentiality\nsupports integrity', 'd-t d-small d-muted') + txt(276, 160, 'Integrity\nsupports availability', 'd-t d-small d-muted') + txt(180, 196, 'Data is trusted and\nready to use', 'd-t d-small');
  return svg(360, 276, out, 'CIA triad: confidentiality, integrity, availability');
};

// IAAA chain
DIAG.iaaa = () => {
  const items = [['Identification', 'Who are you?\nusername, badge'], ['Authentication', 'Prove it.\npassword, MFA, biometric'], ['Authorisation', 'What can you do?\nroles, ACLs'], ['Accountability', 'What did you do?\naudit logs']];
  let out = '';
  items.forEach((it, i) => {
    const y = 8 + i * 84;
    out += rect(10, y, 150, 44, it[0], 'c' + (i + 1));
    out += txt(262, y + 22, it[1], 'd-t d-small');
    if (i < 3) out += arrow(85, y + 46, 85, y + 80);
  });
  return svg(360, 8 + 3 * 84 + 54, out, 'IAAA model: identification, authentication, authorisation, accountability');
};

// Network topologies
DIAG.topo = type => {
  const node = (x, y, l = '') => `<circle cx="${x}" cy="${y}" r="13" class="d-box c2"/>` + (l ? txt(x, y, l, 'd-t d-small') : '');
  const ln = (a, b, c, d) => `<line x1="${a}" y1="${b}" x2="${c}" y2="${d}" class="d-line"/>`;
  let out = '';
  if (type === 'star') {
    const c = [130, 110], p = [[130, 24], [210, 70], [210, 150], [130, 196], [50, 150], [50, 70]];
    p.forEach(q => out += ln(c[0], c[1], q[0], q[1]));
    p.forEach(q => out += node(q[0], q[1]));
    out += `<rect x="106" y="94" width="48" height="32" rx="6" class="d-box c4"/>` + txt(130, 110, 'Switch', 'd-t d-small');
    return svg(260, 220, out + txt(130, 214, 'Star: every device links to a central switch', 'd-t d-small d-muted'), 'Star topology');
  }
  if (type === 'mesh') {
    const p = [[130, 24], [215, 80], [190, 165], [70, 165], [45, 80]];
    for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) out += ln(p[i][0], p[i][1], p[j][0], p[j][1]);
    p.forEach(q => out += node(q[0], q[1]));
    return svg(260, 220, out + txt(130, 208, 'Mesh: every device links to every other', 'd-t d-small d-muted'), 'Mesh topology');
  }
  const root = [130, 26], mid = [[60, 90], [200, 90]], leaf = [[25, 160], [95, 160], [165, 160], [235, 160]];
  mid.forEach(m => out += ln(root[0], root[1], m[0], m[1]));
  [[0, 0], [0, 1], [1, 2], [1, 3]].forEach(([a, b]) => out += ln(mid[a][0], mid[a][1], leaf[b][0], leaf[b][1]));
  out += node(root[0], root[1]);
  mid.forEach(m => out += `<rect x="${m[0] - 24}" y="${m[1] - 14}" width="48" height="28" rx="6" class="d-box c4"/>` + txt(m[0], m[1], 'Switch', 'd-t d-small'));
  leaf.forEach(l => out += node(l[0], l[1]));
  return svg(260, 220, out + txt(130, 208, 'Tree: switches linked in a hierarchy', 'd-t d-small d-muted'), 'Tree topology');
};

// DFD example (own scenario)
DIAG.dfd = () => {
  let out = `<ellipse cx="62" cy="62" rx="52" ry="26" class="d-box c1"/>${txt(62, 62, 'Student')}` +
    `<rect x="170" y="30" width="130" height="64" rx="4" class="d-box c2"/><line x1="170" y1="50" x2="300" y2="50" class="d-line"/><line x1="200" y1="30" x2="200" y2="50" class="d-line"/>` +
    txt(235, 40, 'IT', 'd-t d-small') + txt(235, 72, 'Check\nlogin', 'd-t') +
    `<path d="M170 168 H340 M170 210 H340 M178 168 V210" class="d-line d-nofill"/>${txt(262, 189, 'Accounts', 'd-t')}` +
    arrow(116, 58, 168, 58) + txt(142, 46, 'Username', 'd-t d-small') +
    arrow(168, 80, 116, 76) + txt(140, 96, 'Access\ngranted', 'd-t d-small') +
    arrow(235, 96, 235, 164) + txt(298, 130, 'Look up\naccount', 'd-t d-small') +
    `<ellipse cx="62" cy="190" rx="52" ry="22" class="d-box c1" style="opacity:0"/>`;
  out += txt(180, 250, 'Ellipse: source or destination. Box: process.\nOpen box: data store. Arrows: labelled data.', 'd-t d-small d-muted');
  return svg(360, 280, out, 'Example data flow diagram with a source, a process and a data store');
};

// Information flow diagram example (own scenario)
DIAG.ifd = () => {
  const out = rect(8, 40, 86, 44, 'Customer', 'c1') + rect(138, 40, 86, 44, 'Cashier', 'c2') + rect(268, 40, 84, 44, 'Till', 'c3') +
    rect(138, 160, 86, 44, 'Stock\nsystem', 'c4') +
    arrow(96, 54, 136, 54) + txt(116, 36, 'Basket', 'd-t d-small') +
    arrow(226, 54, 266, 54) + txt(246, 36, 'Prices', 'd-t d-small') +

DIAG._inner_cycle = (cx, cy, r = 66) => {
  const labs = ['Plan', 'Build', 'Test', 'Review'], pos = [[0, -r], [r, 0], [0, r], [-r, 0]];
  let o = '';
  pos.forEach((p, i) => { const q = pos[(i + 1) % 4]; o += path(`M${cx + p[0] * .62} ${cy + p[1] * .62} L${cx + q[0] * .62} ${cy + q[1] * .62}`); });

  return o;
};

T('2.1', 'Infrastructure', {
  sum: 'How networks direct traffic and are protected: routing tables, the commands that show a device\'s network settings, and firewalls.',
  terms: [
    ['Routing table', 'The data a router uses to decide where to send each packet.'],
    ['Network ID', 'Identifies the network a destination address belongs to.'],
    ['Subnet mask', 'Splits an IP address into the network part and the host part, for example 255.255.255.0.'],
    ['Next hop', 'The next device the packet is passed to on its way.'],
    ['Interface', 'The port or network card the packet leaves through.'],
    ['Static route', 'Typed in by hand. Does not change unless someone changes it.'],
    ['Dynamic route', 'Learned automatically from routing protocols, and updates when the network changes.'],
    ['ipconfig / ifconfig', 'Console commands that show a device\'s IP address, subnet mask and default gateway. ipconfig is Windows, ifconfig is Linux and macOS.'],
    ['Firewall', 'Filters network traffic using ALLOW and BLOCK rules.'],
    ['Rule precedence', 'Rules are checked in order and the first match wins, so rule order matters.']
  ],
  must: [
    'To read a routing table: match the destination to a network ID, then read the next hop and the interface.',
    'Secure a firewall\'s administrator access with strong unique passwords, MFA and as few admin accounts as possible, because anyone with admin access can change the rules.',
    'Put specific ALLOW rules above a general BLOCK rule, otherwise the BLOCK matches first and the ALLOW is never reached.'
  ],
  tip: 'Exam questions often give you a small routing table or an ipconfig output. Read it slowly, underline the destination, and say which row it matches.'
}, [
  mc('Which command shows the IP address, subnet mask and default gateway on a Windows PC?', 'ipconfig', ['ifconfig', 'nslookup', 'netstat'], 'ipconfig is the Windows command. ifconfig does the same job on Linux and macOS.', 1),
  mc('In a routing table, what does "next hop" mean?', 'The next device the packet is passed to on its way', ['The final destination of the packet', 'The total number of devices on the route', 'The speed of the network link'], 'A router only needs to know the next step, not the whole route.', 1),
  mc('A firewall has rule 1: BLOCK all traffic, then rule 2: ALLOW web traffic. Web traffic is blocked. Why?', 'Rule 1 matches first, so rule 2 is never reached', ['Firewalls ignore every ALLOW rule', 'ALLOW rules only work for outgoing traffic', 'Rule 2 contains a typing error'], 'Firewalls apply the first matching rule. The order of rules is called precedence.', 2),
  mc('Which kind of route is learned automatically and changes when the network changes?', 'Dynamic', ['Static', 'Manual', 'Hard-coded'], 'Dynamic routes are learned through protocols such as RIP and OSPF.', 2),
  mc('Why should a firewall\'s administrator access be secured?', 'Anyone who gained admin access could change or remove the rules', ['It makes the firewall process traffic faster', 'It stops the firewall needing software updates', 'It lets the firewall block more traffic by itself'], 'Admin access controls the rules, so protecting it protects the whole network.', 2),
  mc('Read this routing table.\nNetwork 192.168.1.0 / 255.255.255.0, next hop 10.0.0.2, interface Eth1\nNetwork 192.168.2.0 / 255.255.255.0, next hop 10.0.0.3, interface Eth2\nA packet arrives for 192.168.2.45. Which interface does it leave through?', 'Eth2', ['Eth1', 'Both Eth1 and Eth2', 'It cannot be routed'], '192.168.2.45 sits in network 192.168.2.0 with mask 255.255.255.0, so the second row matches.', 3)
]);

T('8.4', 'Interrelationship of components required for effective security', {
  sum: 'How confidentiality, integrity and availability depend on each other, and how identification, authentication, authorisation and accountability work together.',
  terms: [
    ['Confidentiality', 'Data is kept private by controlling who has access to it.'],
    ['Integrity', 'Data has not been tampered with. Maintaining confidentiality helps maintain integrity.'],
    ['Availability', 'Data is available and useful. Ensuring integrity helps ensure availability.'],
    ['Identification', 'Recognising the individual (username, badge, biometric ID).'],
    ['Authentication', 'Verifying the claimed identity (password, passphrase, MFA, biometrics).'],
    ['Authorisation', 'Checking what an authenticated user is allowed to access or do (roles, access control lists).'],
    ['Accountability', 'Tracing actions back to the responsible user (audit logs, user activity monitoring).']
  ],
  must: [
    'The CIA elements support each other. If confidentiality fails, integrity can fail, and then data is not trustworthy enough to be available.',
    'IAAA is a chain in order: you cannot authorise someone you have not authenticated.',
    'Biometric methods cannot be forgotten and are quick, but they can be costly and cannot be changed if stolen.'
  ],

X({ id: 'p1-1c', topic: '1.1', marks: 6, cmd: 'Discuss', levels: true,
  q: 'Printers in a school keep showing error code 79. The fault has happened three times this term on different printers, and a recently appointed technician has been asked to fix it. The technician has access to the school\'s fault log, the printer manufacturer\'s website and a forum run by a professional body.\nDiscuss how pattern recognition could help the technician to find a fix quickly.',
  ind: ['Looking up error code 79 in the fault log to see if it has been fixed before and how often it occurs', 'Looking for what the previous occurrences have in common, such as time of year, printer model or software version', 'Searching the manufacturer\'s website or manual for the meaning of the code', 'Searching the forum using the same words and phrases from the error message', 'Considering which source is quickest and whether to use more than one in parallel', 'Using the pattern of earlier fixes to make a prediction and test it first', 'Not accepted: decomposition, abstraction, or following a false pattern'],
  model: 'The technician should start by searching the school\'s fault log for error code 79. Because the fault has happened three times this year, there is a pattern in the log, and an earlier technician may already have recorded a fix. This is the quickest source because it is specific to the school\'s own printers.\nNext, the technician can look at what the earlier records have in common, such as the same printer, the same driver version or the same time of year. A shared feature allows a prediction to be made and tested first.\nIf the log has no answer, the technician can search the manufacturer\'s website for the meaning of the code, and reuse the same words and phrases in a search of the forum to find other organisations reporting the same fault. A forum post may take a long time to be answered, so the technician should decide whether to wait or to carry on with the other sources at the same time.\nOverall, starting with the fault log saves the most time and effort because the pattern is already recorded, and the other sources give a backup if the fix is not found.' });
X({ id: 'p1-2a', topic: '1.2', marks: 2, cmd: 'Explain', q: 'A flowchart contains a decision symbol. Explain the number of outputs the decision symbol must have.',
  pts: ['Two outputs (1)', 'because the test inside the symbol always evaluates to true or false (1)'], alt: 'Accept yes or no for true or false.',

X({ id: 'p1-2b', topic: '1.2', marks: 4, cmd: 'Explain', q: 'Explain two benefits of expressing an algorithm as a flowchart rather than as a written description.',
  pts: ['Easier to see the order of steps (1) because shapes and arrows show the flow visually (1)', 'Decisions are clear (1) because each decision symbol shows both outcomes (1)', 'Easier for non-programmers to understand (1) because it does not need programming knowledge (1)'],

X({ id: 'p1-3a', topic: '1.3', marks: 2, cmd: 'Explain', q: 'A fire has damaged a corridor in an office building. The fire is out, but the network is down in two departments. Explain the type of strategy that is needed to manage the network problem.',
  pts: ['Incident management (1)', 'because it focuses on restoring the service quickly (rather than finding the cause of the fire) (1)'], alt: 'Do not accept top-down, bottom-up or root cause analysis.',
  model: 'Incident management, because the priority is to detect the problem, restore the network service and record what happened, rather than to find out why the fire started.' });
X({ id: 'p1-3b', topic: '1.3', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A college has to replace its room booking system within two weeks. The system has a booking screen, a calendar database and an email notification function. A team of three developers is available, each with different skills. The calendar database will be replaced again next year.\nEvaluate whether modularisation is a suitable way to develop the new booking system.',
  ind: ['For: the three developers can work on separate modules in parallel, helping to meet the two week deadline', 'For: each developer can focus on their own area of expertise (screen, database, email)', 'For: the database module can be replaced next year without rebuilding the other modules', 'For: modules can be tested separately, making faults easier to find', 'Against: the interfaces between modules must be agreed and designed, which takes meetings and time', 'Against: one module being late can leave others waiting (blocked)', 'Against: a more formal testing phase is needed to test the modules together (integration testing)', 'Conclusion weighing the points, such as the advantages outweighing the extra coordination because of the deadline and the planned database replacement'],
  model: 'Modularisation means splitting the system into separate modules that can be built and tested independently. In this case the natural modules are the booking screen, the calendar database and the email notifications.\nThe biggest advantage is time. With a two week deadline and three developers, each person can build a module at the same time, instead of working one after another. Each developer can also work on the area they know best, which saves them learning someone else\'s area. Another advantage is that the calendar database will be replaced next year. Because it is a separate module, only that module and its link to the others need to change, rather than the whole system.\nThere are drawbacks. The modules have to work together, so the developers must agree how the screen talks to the database and how the database talks to the email function. That takes time and a mistake would stop the system working. If one module is late the others can be left waiting. The system will also need a proper testing phase to check the modules work together as well as on their own.\nOverall, modularisation is suitable. The deadline is tight and the database is going to change, and both points favour independent parts. The extra planning of interfaces and testing is a cost worth paying, provided the developers agree the interfaces at the start.' });

// ---- Area 2 ----
X({ id: 'p1-21', topic: '2.1', marks: 3, cmd: 'Explain', q: 'A firewall has two rules in this order: Rule 1 BLOCK all traffic. Rule 2 ALLOW web traffic. Users cannot reach websites.\nExplain with additional justification why this happens.',
  pts: ['The rules are checked in order (1)', 'so Rule 1 matches all traffic first (1)', 'so Rule 2 is never reached, and the ALLOW rule has no effect (1)'], alt: 'One mark for the point, one for a linked justification and one for a further justification of the first justification.',
  model: 'The firewall checks rules in order and applies the first one that matches. Rule 1 blocks all traffic, so web traffic matches it first. This means Rule 2 is never reached, so the ALLOW rule has no effect and websites stay blocked. The fix is to put the ALLOW rule above the BLOCK rule.' });
X({ id: 'p1-22', topic: '2.2', marks: 2, cmd: 'Explain', q: 'A warehouse has heavy machinery that causes electrical interference. Explain why shielded twisted pair (STP) is more suitable than unshielded twisted pair (UTP).',
  pts: ['STP has shielding / foil screening (1)', 'which reduces interference so data is less likely to be corrupted (1)'], alt: 'Accept any other appropriate response.',
  model: 'STP has a foil shield around the pairs, which blocks electrical interference from machinery, so fewer signals are corrupted than with UTP.' });
X({ id: 'p1-23', topic: '2.3', marks: 4, cmd: 'Explain', q: 'A company moves its phones to VoIP. Explain two network metrics that will affect the quality of calls.',
  pts: ['Latency (1) because a long delay causes lag and people talking over each other (1)', 'Jitter (1) because uneven delays make audio choppy (1)', 'Packet loss (1) because missing packets create gaps in the conversation (1)', 'Bandwidth (1) because too little capacity reduces call quality when many calls are made (1)'],
  alt: 'Max 4 marks: two metrics, each with a linked reason.',
  model: 'Latency affects call quality because a long delay between speaking and hearing causes lag, so people talk over each other. Packet loss affects it because missing packets leave gaps in the audio, so words are lost.' });
X({ id: 'p1-24', topic: '2.4', marks: 12, cmd: 'Evaluate', levels: true,
  q: 'A graphic designer edits very large video files offline.\nDevice A: 6 cores, 3.0 GHz, 32 GB RAM, 512 GB SSD, video editing software installed.\nDevice B: 10 cores, 3.6 GHz, 16 GB RAM, 256 GB SSD, no video software installed.\nEvaluate how well Device A and Device B meet the designer\'s needs.',
  ind: ['Device A: 32 GB RAM can hold more of the large video files in memory, reducing swapping to storage', 'Device A: 512 GB SSD gives space for large files and fast access', 'Device A: video software already installed, saving setup time and cost', 'Device A: fewer cores and lower clock speed could mean slower rendering', 'Device B: more cores allow parallel processing of video effects and faster rendering', 'Device B: higher clock speed executes more instructions per second', 'Device B: only 16 GB RAM may limit work on large files and cause slowdowns from virtual memory', 'Device B: 256 GB SSD fills quickly with video files', 'Device B: software must be bought and installed, using more storage', 'Conclusion that judges which device suits better and says how significant the differences are'],
  model: 'Device A has 32 GB of RAM, which is double Device B. Video files are very large, so more RAM means more of the file can be held in memory and the system swaps to storage less often. Device A also has twice the storage, 512 GB, which matters because video files are huge. The video software is already installed, which saves time and cost, and does not use up any of Device B\'s smaller disk. A drawback is that Device A has only 6 cores and a lower clock speed, so rendering may take longer.\nDevice B has more cores and a faster clock speed. More cores let the software process several parts of a video at the same time, and a faster clock speed carries out more instructions each second, so rendering should be quicker. However, it has only 16 GB of RAM and 256 GB of storage. With very large video files the RAM could run out, causing slowdowns, and the disk would fill quickly. It also has no video software, so extra cost is needed and the software will take up some of its limited storage.\nOverall, Device A is more suitable. The designer works offline on very large files, so memory and storage are the main limits, and Device B\'s extra processing power will not help if it runs short of both. Device A is ready to use as well. Device B would be better only if rendering speed mattered more than the size of the files.' });
X({ id: 'p1-25', topic: '2.5', marks: 3, cmd: 'Explain', q: 'A technician has updated the software on a booking system. Explain with additional justification why regression testing should be carried out.',

X({ id: 'p1-26', topic: '2.6', marks: 3, cmd: 'Write', q: 'A spreadsheet holds support tickets. Column B contains the ticket status (Open or Closed). Column C contains the number of hours spent on each ticket, in rows 2 to 21.\nWrite a formula that gives the number of Open tickets plus the total number of hours.',

X({ id: 'p1-27a', topic: '2.7', marks: 6, cmd: 'Draw', draw: 'dfd', q: 'A school office creates a library account for each new student.\n- The student gives their student number.\n- Student names are held in a data store.\n- The office creates a username and a random PIN.\n- The username and PIN are saved to a data store and given to the student.\nDraw a data flow diagram of this system.',

  alt: 'Accept any other appropriate diagram that represents the system accurately.',
  model: 'Student (ellipse) sends Student number to a process box labelled School office: Create library account. A data store called Students supplies Name to the process. The process sends Username and PIN to a data store called Library accounts, and also sends Username and PIN back to the Student. All arrows are one-way and labelled.' });
X({ id: 'p1-27b', topic: '2.7', marks: 6, cmd: 'Draw', draw: 'ifd', q: 'A shop has a self-checkout system.\n- The customer scans items at the scanner.\n- The scanner sends item codes to the till.\n- The till gets prices from the price database.\n- The till shows the total to the customer.\n- The customer pays at the till and receives a receipt.\nDraw an information flow diagram to show this system.',
  pts: ['Boxes for each actor or system: customer, scanner, till, price database (1)', 'Customer to scanner flow of items (1)', 'Scanner to till flow of item codes (1)', 'Till to price database and price database to till flows (1)', 'Till to customer flows (total and receipt) and payment from customer to till (1)', 'Correct notation: boxes, one-way arrows and labels on every arrow (1)'],
  alt: 'Accept alternative shapes and any other appropriate responses.',

X({ id: 'p1-28', topic: '2.8', marks: 4, cmd: 'Explain', q: 'A server room has a risk of overheating. The likelihood is probable (4) and the severity is critical (4).\n(a) Calculate the risk score. (1)\n(b) Explain one reason why the risk should be recorded in risk assessment documentation. (3)',

X({ id: 'p1-29', topic: '2.9', marks: 3, cmd: 'Identify', q: 'A project has these activities.\nA, 2 days, no predecessor, Order laptops\nB, 3 days, predecessor A, Image laptops\nC, 1 day, no predecessor, Book training room\nD, 2 days, predecessors B and C, Deliver training\n(a) Identify the predecessor(s) of activity D. (1)\n(b) Identify the shortest time the project can take, using the critical path. (1)\n(c) State the activities on the critical path. (1)',

X({ id: 'p1-210', topic: '2.10', marks: 6, cmd: 'Discuss', levels: true,
  q: 'A support team at a college has had many complaints about slow responses from the IT helpdesk. The manager wants to use a structured approach to improve the service.\nDiscuss how the team could use Gibbs\' reflective cycle and design thinking to improve the helpdesk.',
  ind: ['Gibbs: describe what happened, such as response times and the types of complaint', 'Gibbs: feelings of staff and users about the service', 'Gibbs: evaluate what went well and badly, analyse why, and form a conclusion', 'Gibbs: write an action plan with changes to make', 'Design thinking: empathise with users by asking them about their experience', 'Design thinking: define the problem, ideate ideas, create a prototype of a new process and gather user feedback, repeating the cycle', 'Drawback of Gibbs: reflective, so slow for urgent faults, relies on honesty', 'Drawback of design thinking: many cycles can take time and effort'],
  model: 'Gibbs\' cycle would help the team to look back at the problem. They would describe what has been happening, such as long waiting times, and record how staff and users felt about it. They would then evaluate what has gone well and badly, analyse why responses are slow, for example too few staff at peak times, and reach a conclusion. The cycle ends with an action plan, such as rotas for busy times. Gibbs is good for learning from past experience, but it is reflective, so it would not solve an urgent fault quickly.\nDesign thinking would focus on the users. The team would empathise by asking staff what they need when they contact the helpdesk, define the main problem, and come up with ideas such as a self-service portal. They would build a prototype, get feedback from users and repeat until it works well. This keeps the solution centred on users, but it can take many cycles.\nUsing both would work well: Gibbs identifies what is wrong, and design thinking creates a solution that users have helped to shape.' });
X({ id: 'p1-211', topic: '2.11', marks: 4, cmd: 'Explain', q: 'A technician finds two different fixes for a server fault on two websites. Explain two factors the technician should consider when deciding which source to trust.',
  pts: ['Bias or subjectivity (1) because a seller may promote its own product (1)', 'Evidence or expertise (1) because the author should be qualified or give proof (1)', 'Publication date (1) because old fixes may not work on current software (1)', 'Corroboration (1) because agreement with other sources increases confidence (1)'],
  alt: 'Max 4 marks: two factors, each with a linked reason.',
  model: 'The technician should check the publication date, because technology changes quickly and an old fix may not suit the current version of the software. They should also look for corroboration, because if other independent sources suggest the same fix, it is more likely to be reliable.' });

// ---- Area 3 ----
X({ id: 'p1-31', topic: '3.1', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A gym stores a record every time a member scans their card at the door. The records have been stored for 18 months. Because of a software fault, no data was recorded for four of those months, which are spread through the period.\nEvaluate the suitability of using this stored data to plan class timetables and targeted offers.',
  ind: ['For: 14 months of data is a large number of records from a reliable automated source', 'For: member numbers show who comes and how often, identifying regular and occasional members', 'For: times and dates show peak and quiet periods, useful for timetabling', 'Against: four months missing is over 20 percent, so patterns may be unreliable', 'Against: seasonal patterns are harder to see if some months are missing', 'Against: no data on which classes members attended or what they want', 'Against: the data cannot show why members left or what offers would appeal', 'Conclusion that weighs the points, such as using it with caution and adding other sources'],
  model: 'The data comes from card scans, so it is automatic and has no human entry errors. Fourteen months of records is a large amount, and each record shows which member came and when. This could show peak times, so classes could be timetabled when the gym is busiest. It could also show which members come regularly and which have stopped, so offers could be aimed at them.\nHowever, four months are missing, which is more than a fifth of the period. If these months include a busy season, such as January, peak times could be wrongly judged, and a member who seems to have stopped may have been recorded during a missing month. The data also shows only when members entered. It does not show which class they attended or what they would like, so targeted offers would be based on guesses.\nOverall, the data is useful for timetabling because patterns across 14 months are likely to hold, but it is less suitable for targeted offers. The gap lowers confidence, so the gym should combine it with other data, such as class bookings or a survey, before acting.' });

X({ id: 'p1-33', topic: '3.3', marks: 2, cmd: 'Give', q: 'A shop stores each customer\'s age as a band such as 18 to 24 or 25 to 34 instead of an exact age.\nGive one justification for storing age as categorical values.',

X({ id: 'p1-37', topic: '3.7', marks: 4, cmd: 'Explain', q: 'A weather company collects readings from thousands of sensors every second. Explain how two of the six Vs affect how the company gathers and stores its data.',
  pts: ['Volume (1) because the very large amount of data needs a large amount of storage (1)', 'Velocity (1) because data arrives very quickly and must be processed or stored fast enough (1)', 'Veracity (1) because faulty sensors may give inaccurate readings that need to be checked (1)', 'Variety (1) because readings from different sensors may be in different formats (1)'],
  alt: 'Max 4 marks: two Vs, each with a linked reason.',
  model: 'Volume affects storage because thousands of sensors every second produce a huge amount of data, so the company needs large and expandable storage. Velocity affects gathering because data arrives constantly and the system must be able to process and save it as fast as it arrives.' });
X({ id: 'p1-38', topic: '3.8', marks: 4, cmd: 'Explain', q: 'A hospital receptionist types patient numbers into a system and often swaps digits around.\n(a) Name this type of data entry error. (1)\n(b) Explain one way to reduce this type of error. (3)',

X({ id: 'p1-311', topic: '3.11', marks: 2, cmd: 'Explain', q: 'A hospital wants nurses to see patient records, but only doctors to change prescriptions. Explain the method of access control that should be used.',

X({ id: 'p1-312', topic: '3.12', marks: 6, cmd: 'Discuss', levels: true,
  q: 'A supermarket chain wants to analyse sales from all its stores, website and loyalty app to plan offers. The data is in many formats and is growing quickly.\nDiscuss how a data lake, a data warehouse and data marts could be used.',
  ind: ['Data lake: stores raw data in its original format, including unstructured data from the app and website', 'Data warehouse: holds cleaned, structured data from many sources for analysis and reporting', 'Data marts: smaller subsets of the warehouse for departments such as marketing or finance', 'Data mining: finding patterns such as products bought together', 'Reporting and business intelligence: CRM or financial planning', 'Scale: spreadsheets cannot cope with this amount of data', 'Drawbacks: cost, skills needed, keeping data clean'],
  model: 'A data lake could store all of the raw data from the stores, website and app, in whatever format it arrives. This suits the supermarket because the data is in many formats and growing fast. The raw data can be kept until it is needed.\nUseful data could then be cleaned and organised into a data warehouse. The warehouse holds structured data from all sources, so analysts can compare sales across stores and look for patterns using data mining, for example products often bought together. The results can be given in reports to help plan offers.\nData marts could be created from the warehouse for particular departments. For example, a marketing mart would hold customer data for planning offers, while finance would have its own mart. Each team then works with a smaller data set that is quicker to use.\nThese tools are suitable because spreadsheets could not cope with this amount of data. Drawbacks are the cost and the skills needed to build and maintain them, and the data must be cleaned or analysis will be misleading.' });

X({ id: 'p2-41a', topic: '4.1', marks: 2, cmd: 'Explain', q: 'A technician has to carry a heavy server rack across a warehouse. Explain one action the employer should take to follow manual handling regulations.',

X({ id: 'p2-41b', topic: '4.1', marks: 6, cmd: 'Discuss', levels: true,
  q: 'A school is replacing 200 laptops. The laptops contain staff and student records. Some parts are toxic if burned and some contain valuable metals.\nDiscuss the issues the school should consider when deciding how to dispose of the laptops.',
  ind: ['WEEE Regulations: electrical equipment must be disposed of safely and in an environmentally responsible way', 'Landfill: toxic chemicals can leach into the ground, and criminals could recover data from the disks', 'Incineration: toxic fumes, and data security risk if devices are diverted', 'Data protection: personal data on the drives must be unrecoverable, for example by shredding the drives', 'Recycling: specialist companies can recover metals and rare earths', 'Reuse or donation: not suitable unless data has been securely destroyed', 'Cost and use of a certified disposal service with certificates of destruction'],
  model: 'The first issue is the law. The WEEE Regulations require electrical equipment to be disposed of safely and in an environmentally responsible way, so the laptops cannot simply be thrown away. If they went to landfill, toxic chemicals could leach into the ground, and criminals could collect the laptops and try to recover the staff and student records. Incineration is also unsuitable because some parts give off toxic fumes when burned.\nThe second issue is data security. The laptops hold personal data, so the school must make sure it cannot be recovered, because a leak would break data protection rules and damage trust. The school could use a specialist company that physically shreds the drives and gives a certificate of destruction.\nThe third issue is the environment and cost. The remaining parts contain valuable metals, so a specialist recycler can recover them. Donating the laptops to a charity would be good for the community but is only acceptable if the drives are destroyed or securely wiped first.\nOverall, using a certified disposal service that destroys the drives and recycles the rest deals with both the legal duties and the data risk.' });
