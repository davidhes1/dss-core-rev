X({ id: 'p2-54', topic: '5.4', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A chain of garages is replacing its paper job cards with a new digital job system in all 12 sites. Staff are used to paper and some are worried about change. The garages cannot afford to stop working.\nEvaluate the suitability of piloting the new system at one site before introducing it everywhere.',
  ind: ['For: a pilot tests the system in real conditions with a small group', 'For: problems are found and fixed before all sites are affected', 'For: pilot staff can give feedback and become champions, reducing resistance', 'For: training can be improved before wider rollout', 'Against: slower overall than direct changeover', 'Against: two ways of working at once may confuse staff and need extra support', 'Against: the pilot site may not represent all garages', 'Other methods: direct is risky, parallel is costly, phased is slower but staged', 'Conclusion that weighs the points, using the scenario (cannot stop work, worried staff)'],
  model: 'A pilot means the new system is first used at one garage while the others keep using paper. This is suitable because the garages cannot afford to stop working. If the system has faults, only one site is affected, and the problems can be fixed before 11 other sites rely on it.\nA pilot also helps with staff who are worried about change. The pilot staff can give feedback, show colleagues the system works and help train them, which should reduce resistance. The company can also improve training materials before the wider rollout.\nThere are drawbacks. A pilot is slower than switching all sites at once, so the benefits take longer to arrive. The pilot site and the others may work differently, so the test may not show every problem. During the pilot the company is also running two systems, which can cause confusion and needs extra support.\nOverall, a pilot is suitable. The business cannot stop trading and staff are nervous, so reducing risk matters more than speed. A direct changeover would be too risky, and a parallel run at every site would be costly. The pilot should be followed by a phased rollout to the other sites.' });

X({ id: 'p2-62', topic: '6.2', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A delivery company plans to replace some van drivers with autonomous drones and robot sorting machines in its depot. The company is in a rural area with few other employers.\nEvaluate the effect of this change on the company\'s current staff.',
  ind: ['Drawbacks: loss of jobs for drivers and sorters, especially in an area with few other employers', 'Drawbacks: retraining costs and some staff unable or unwilling to retrain', 'Drawbacks: worry and loss of morale', 'Benefits: safer work with less heavy lifting and fewer driving risks', 'Benefits: new, higher skilled roles such as maintenance and control', 'Benefits: upskilling and transferable skills, and possibly higher pay', 'Benefits to the company: longer operating hours and lower costs, which may secure remaining jobs', 'Conclusion that weighs the points, with reference to the rural context'],
  model: 'For the staff, the biggest drawback is job loss. Fewer drivers and sorters would be needed, and in a rural area with few other employers they could find it hard to find new work, so long-term unemployment is a real risk. Some staff may not be able to retrain, and the uncertainty could lower morale.\nThere are benefits for those who stay. Robot sorters take over heavy lifting, so the risk of injury falls. New roles such as maintaining the machines and controlling the drones need higher skills, so staff who are retrained gain transferable skills and may be paid more. Lower costs and longer operating hours could also help the company survive, which protects the remaining jobs.\nOverall, the effect is mixed. Staff who can be retrained gain safer and better skilled work, but those who cannot are badly affected because of the lack of alternative work locally. The company should give retraining before the change and support staff who lose their jobs.' });

// ---- Area 7 ----
X({ id: 'p2-71', topic: '7.1', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A secondary school stores 10 years of student assignment backups on a server in its IT room. Files are written once at night and almost never read. The server is mains powered and never moved. The school has a limited budget.\nEvaluate the suitability of using solid state drives (SSDs) rather than magnetic hard disk drives for this storage.',
  ind: ['SSD benefits: faster access, no moving parts, quieter, lower power use', 'SSD drawbacks: much higher cost per gigabyte, which matters for a large archive on a limited budget', 'Magnetic benefits: low cost per gigabyte and high capacity for large archives', 'Magnetic drawbacks: moving parts that can fail, slower, fragile if moved', 'Speed is not important because files are read rarely', 'The server is not moved and has mains power, so fragility and power are minor concerns', 'Fragmentation is not a big problem if files are written once', 'RAID could be added for resilience', 'Conclusion that weighs cost, speed and reliability for this scenario'],
  model: 'SSDs are faster, silent and have no moving parts, so they are less likely to fail from knocks or wear, and they use less power. However, they cost much more per gigabyte. The school needs to store ten years of data, so the cost of enough SSD capacity would be high on a limited budget.\nMagnetic hard disks are much cheaper per gigabyte and provide large capacity. Their drawbacks are moving parts, slower access, higher power use and fragility. In this scenario those matter less. The server is never moved, so it is unlikely to be knocked, and it is mains powered, so power use is not critical. Files are written once and almost never read, so slow access time hardly matters and fragmentation will be rare.\nOverall, magnetic hard disks are more suitable. The main need is cheap, large capacity, and the speed advantage of SSDs is not needed for an archive. The school should use RAID to protect against a drive failing, and an SSD could be kept only for the operating system if faster boot times were wanted.' });

  pts: ['It responds within a guaranteed time (1)', 'so readings and alarms are not delayed, which could put patients at risk (1)'], alt: 'Accept monitoring and control with a linked reason.',

X({ id: 'p2-73a', topic: '7.3a', marks: 12, cmd: 'Evaluate', levels: true,
  q: 'An accountancy firm has five staff in one office of 30 square metres. They share client files, need a central backup, and must keep client data private. The budget for networking is £2 000. The firm has no IT staff, and the owner wants the network installed over one weekend.\nEvaluate the suitability of a client-server network or a peer-to-peer network for the firm.',
  ind: ['Peer-to-peer: no server to buy, so cheaper and within budget', 'Peer-to-peer: quick and simple to set up, possible over one weekend', 'Peer-to-peer: no central storage, so backups must be made on each PC', 'Peer-to-peer: harder to control who can see client files, a risk for privacy', 'Peer-to-peer: each PC carries extra load as a server', 'Client-server: central storage makes backup easy and enables version control', 'Client-server: central user accounts and permissions protect client data', 'Client-server: a server costs money and may use much of the budget', 'Client-server: needs technical skills to set up and maintain, and the firm has no IT staff', 'Distances are short, so cabling costs are small in either case', 'Conclusion judging which model suits and why, or a recommendation such as using a small NAS or managed service'],
  model: 'A peer-to-peer network would be cheap because no server is needed, and with only five PCs in one small room it could be set up in a weekend by the staff themselves. However, the firm needs a central backup and to protect client data. In a peer-to-peer network the files are spread over five machines, so each one must be backed up separately and it is harder to control who can see which files. Each PC also acts as a server, which can slow down the person using it.\nA client-server network stores files in one place, so it is easy to back up and to give each member of staff the right permissions, which protects client privacy. It also allows one version of each file to be shared. However, a server costs money and could use much of the £2 000 budget. A server also needs technical skills to set up and maintain, and the firm has no IT staff, so installation over a weekend may not be realistic without paying for help.\nOverall, client-server is more suitable for the firm\'s needs because privacy and backup are the key requirements for accountants. The firm should find a low-cost server or network storage device within the budget, and use a support company for set up. Peer-to-peer is only suitable if the firm accepts weaker control and separate backups.' });
X({ id: 'p2-73b', topic: '7.3b', marks: 4, cmd: 'Explain', q: 'Explain two reasons why a website should use HTTPS rather than HTTP.',
  pts: ['Data is encrypted (1) so it cannot be read if intercepted (1)', 'The website identity is verified (1) so users know they are connected to the real site (1)', 'Protects logins and payment details (1) from being stolen (1)', 'Browsers warn users about HTTP sites (1) so customers may not trust the site (1)'],
  alt: 'Max 4 marks: two reasons, each with a linked justification.',
  model: 'HTTPS encrypts the data sent between the user and the website, so if it is intercepted it cannot be read. HTTPS also confirms the identity of the website, so users know they are connected to the real site and not a fake one.' });
X({ id: 'p2-74', topic: '7.4', marks: 2, cmd: 'Explain', q: 'Explain one benefit to an IT department of using virtual machines to test new software.',
  pts: ['The software is tested in an isolated environment (1)', 'so any fault or malware does not affect live systems (1)'], alt: 'Accept easy to reset or copy, with a linked reason.',

X({ id: 'p2-75', topic: '7.5', marks: 6, cmd: 'Discuss', levels: true,
  q: 'A small online shop currently runs its website on a server in the owner\'s home. Sales double each December and the site often crashes. The owner is considering moving to a public cloud IaaS service.\nDiscuss the issues the owner should consider.',
  ind: ['Elasticity: resources can be increased in busy periods and reduced afterwards', 'Cost effectiveness: pay for what is used instead of buying hardware for peak demand', 'Less storage limitation and portability', 'IaaS: the owner still manages the OS, applications, runtime and data, so skills are needed', 'Provider manages hardware and virtualisation, reducing maintenance', 'Reliance on the provider and the internet connection', 'Security and data protection: where data is held and who is responsible', 'Costs can increase if usage is high', 'PaaS or SaaS might need less technical knowledge'],
  model: 'The main benefit is elasticity. The shop is busy in December, so with IaaS the owner could increase capacity for that month and reduce it afterwards. This should stop the site crashing and the owner only pays for what is used, rather than buying a bigger server that sits idle for the rest of the year. The provider also looks after the hardware and virtualisation, so there is no need to maintain a server at home.\nThere are issues to consider. With IaaS the owner is still responsible for the operating system, applications, runtime and data, so the shop needs the skills to manage and secure them, or must pay someone to help. The shop will also depend on the provider and on its internet connection, and costs could become high if traffic grows. The owner must also check how customer data is protected.\nOverall, the cloud is likely to suit the shop because of December demand, but the owner should consider whether PaaS would reduce the technical work.' });
X({ id: 'p2-76', topic: '7.6', marks: 3, cmd: 'Explain', q: 'A hospital wants to be able to continue working within minutes of a major failure. Explain with additional justification why it should use a hot site.',
  pts: ['A hot site is fully equipped and running (1)', 'with current copies of the data (1)', 'so it can take over almost immediately, limiting downtime that could affect patients (1)'], alt: 'Point, linked justification, further justification.',
  model: 'A hot site is fully equipped and already running with current copies of the data. This means it can take over almost immediately, so downtime is minimal and patient care is not interrupted.' });

X({ id: 'p2-81a', topic: '8.1', marks: 2, cmd: 'State', q: 'Salaries are one type of confidential Human Resources information. State two types of access information that an organisation must keep confidential.',

X({ id: 'p2-82a', topic: '8.2a', marks: 4, cmd: 'Explain', q: 'A finance director receives an email that uses her name and refers to a real project. It asks her to open an attachment.\n(a) Name the type of attack. (1)\n(b) Explain one way to reduce the risk of this attack succeeding. (3)',

X({ id: 'p2-82b', topic: '8.2b', marks: 3, cmd: 'Explain', q: 'A server room door is often propped open during the day so engineers can move equipment in and out. The door is next to a corridor used by visitors.\nExplain with additional justification one physical vulnerability caused by this.',

X({ id: 'p2-83b', topic: '8.3', marks: 9, cmd: 'Evaluate', levels: true,
  q: 'A law firm holds sensitive client files on a server. It has been targeted by ransomware before. The firm\'s IT budget is small and most staff have little technical knowledge.\nEvaluate the suitability of using anti-malware software, staff training and offline backups to protect the firm.',
  ind: ['Anti-malware: detects and quarantines malware automatically, low effort. Drawback: cannot catch new threats and needs updates, and does not stop human error', 'Staff training: reduces risk from phishing, which is a common route for ransomware, builds awareness. Drawback: takes time, effect fades, and one mistake can still happen', 'Offline backups: allow recovery without paying a ransom, protected from encryption. Drawback: restore takes time, backups must be tested, and data may be lost since the last backup', 'Backups do not stop data being stolen, which matters for confidentiality', 'Budget and skills: anti-malware and training are affordable, offline backups need discipline', 'Layered defence is better than a single measure', 'Conclusion that judges how suitable the combination is and which is most important'],
  model: 'Anti-malware software scans for and quarantines known malware automatically. This suits a firm with little technical skill because it needs little effort and is affordable. However, it cannot always detect brand new threats, it must be kept up to date, and it will not stop a member of staff being tricked into running something.\nStaff training reduces the chance of someone opening a phishing email, which is a common way for ransomware to get in. This is also fairly low cost. However, it takes time, people forget, and one mistake can still let an attack in.\nOffline backups are the most useful if ransomware does succeed, because the firm can restore its files without paying a ransom. Because they are offline, the ransomware cannot encrypt them. The drawbacks are that restoring takes time, some recent work may be lost, backups must be tested, and backups do not stop confidential data being stolen.\nOverall, the three measures work well together because each covers the weakness of another. If only one could be chosen, offline backups give the best protection against the effects of ransomware. Anti-malware and training are still needed to reduce the chance of the attack happening and to protect client confidentiality.' });

}

DIAG.cards = (items, o = {}) => {

  const lines = items.map(it => it.s ? wrap(it.s, Math.floor((cw - 18) / (it.mono ? 7.6 : 6.3))).split('\n') : []);
  const ch = o.ch || Math.max(...lines.map(l => 38 + l.length * 14 + 6), 46);
  const rows = Math.ceil(items.length / cols);
  let out = '';
  items.forEach((it, k) => {
    const r = Math.floor(k / cols), c = k % cols, x = 6 + c * (cw + gap), y = 6 + r * (ch + gap);
    out += `<rect x="${x.toFixed(1)}" y="${y}" width="${cw.toFixed(1)}" height="${ch}" rx="9" class="d-box ${it.c || 'c' + ((k % 7) + 1)}"/>`;
    if (it.i) out += icon(it.i, x + 19, y + 19, 21);
    out += `<text x="${(x + (it.i ? 34 : 10)).toFixed(1)}" y="${y + 20}" class="d-t d-b${it.t.length * 9 > cw - (it.i ? 40 : 18) ? ' d-small' : ''}" dominant-baseline="middle">${esc(it.t)}</text>`;
    lines[k].forEach((l, j) => { out += `<text x="${(x + 10).toFixed(1)}" y="${y + 42 + j * 14}" class="d-t d-small${it.mono ? ' d-mono' : ''}">${esc(l)}</text>`; });
  });
  return svg(W, 12 + rows * (ch + gap) - gap, out, o.label || items.map(i => i.t + (i.s ? ': ' + i.s : '')).join('. '));
};

  for (let g = 0; g < 40 && clash(place()); g++) { if (H < 420) H += 10; else if (bw > 92) bw -= 4; else break; }
  const cx = W / 2, cy = H / 2, rx = W / 2 - bw / 2 - 6, ry = H / 2 - bh / 2 - 6;
  let lines = '', boxes = '';
  items.forEach((it, k) => {
    const a = (-90 + (360 / n) * k) * Math.PI / 180, x = cx + rx * Math.cos(a), y = cy + ry * Math.sin(a);
    lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="d-line"/>`;
    boxes += `<rect x="${(x - bw / 2).toFixed(1)}" y="${(y - bh / 2).toFixed(1)}" width="${bw}" height="${bh}" rx="9" class="d-box ${it.c || 'c' + ((k % 7) + 1)}"/>`;
    if (it.i) boxes += icon(it.i, x - bw / 2 + 15, y, 18);
    boxes += txt(x + (it.i ? 9 : 0), y, wrap(it.t, it.i ? 11 : 13), 'd-t d-small d-b', 13);
  });
  const cr = o.cr || 48;
  const centreTxt = txt(cx, cy, wrap(centre, 11), 'd-t d-b', 15);
  return svg(W, H, lines + boxes + `<circle cx="${cx}" cy="${cy}" r="${cr}" class="d-box c6"/>` + centreTxt, o.label || centre + ': ' + items.map(i => i.t).join(', '));

DIAG.raid = () => {
  const disk = (x, y, blocks, cls) => { let g = `<rect x="${x}" y="${y}" width="58" height="${18 + blocks.length * 20}" rx="7" class="d-box ${cls}"/><ellipse cx="${x + 29}" cy="${y + 4}" rx="29" ry="5" class="d-box ${cls}"/>`; blocks.forEach((b, i) => { g += `<rect x="${x + 7}" y="${y + 12 + i * 20}" width="44" height="16" rx="3" class="d-box ${b.indexOf('p') > 0 ? 'r2' : 'c7'}"/>` + txt(x + 29, y + 20 + i * 20, b, 'd-t d-small d-b'); }); return g; };
  let o = txt(60, 12, 'RAID 1', 'd-t d-b') + disk(6, 24, ['A1', 'A2'], 'c1') + disk(70, 24, ['A1', 'A2'], 'c1') + txt(68, 96, 'mirror: copy on both', 'd-t d-small');
  o += txt(250, 12, 'RAID 5', 'd-t d-b') + disk(156, 24, ['A1', 'B1', 'Cp'], 'c2') + disk(220, 24, ['A2', 'Bp', 'C1'], 'c2') + disk(284, 24, ['Ap', 'B2', 'C2'], 'c2') + txt(250, 116, 'stripes + parity (p), 3+ disks', 'd-t d-small');
  o += txt(180, 140, 'RAID 10', 'd-t d-b') + disk(36, 152, ['A1', 'A3'], 'c3') + disk(100, 152, ['A1', 'A3'], 'c3') + disk(196, 152, ['A2', 'A4'], 'c4') + disk(260, 152, ['A2', 'A4'], 'c4');
  o += txt(180, 224, 'two mirrored pairs, striped: 4+ disks', 'd-t d-small');
  return svg(360, 234, o, 'RAID 1 mirrors data on two disks. RAID 5 stripes data with parity across three disks. RAID 10 stripes across mirrored pairs.');
};
DIAG.storagecmp = () => {
  const cols = ['Speed', 'Capacity', 'Low cost', 'Robust'], rows = [['HDD', [2, 3, 3, 1]], ['SSD', [3, 2, 1, 3]], ['Optical', [1, 1, 2, 2]]];
  let o = '';
  cols.forEach((c, j) => { o += txt(126 + j * 62, 14, c, 'd-t d-small d-b'); });
  rows.forEach((r, i) => { o += `<text x="8" y="${44 + i * 34}" class="d-t d-b" dominant-baseline="middle">${r[0]}</text>`; r[1].forEach((v, j) => { for (let d = 0; d < 3; d++) o += `<circle cx="${108 + j * 62 + d * 17}" cy="${44 + i * 34}" r="6.5" class="d-box ${d < v ? 'c' + (i + 1) : 'd-empty'}"/>`; }); });
  o += txt(180, 140, 'More filled dots = better on that measure', 'd-t d-small d-muted');
  return svg(360, 150, o, 'HDD, SSD and optical storage compared on speed, capacity, cost and robustness');
};

DIAG.cables = () => {
  const pair = (x, y, col) => `<circle cx="${x - 5}" cy="${y}" r="6" fill="${col}" stroke="#1e293b" stroke-width="1"/><circle cx="${x + 5}" cy="${y}" r="6" fill="#f8fafc" stroke="${col}" stroke-width="3"/>`;
  const pairs = (cx, cy) => pair(cx - 12, cy - 10, '#f97316') + pair(cx + 12, cy - 10, '#22c55e') + pair(cx - 12, cy + 10, '#3b82f6') + pair(cx + 12, cy + 10, '#a16207');
  const cells = [
    { x: 0, y: 0, t: 'UTP', layers: [[40, '#2563eb', '#1e3a8a'], [34, '#e2e8f0']], pairs: 1, call: [['jacket', 37], ['twisted pairs', 20]] },
    { x: 180, y: 0, t: 'STP', layers: [[40, '#475569', '#1e293b'], [35, '#cbd5e1', '#64748b'], [31, '#e2e8f0']], pairs: 1, foil: 1, call: [['jacket', 38], ['foil shield', 33], ['pairs', 20]] },
    { x: 0, y: 120, t: 'Coaxial', layers: [[40, '#1f2937', '#0b1220'], [34, '#b45309'], [27, '#f8fafc'], [9, '#d97706', '#78350f']], braid: 1, call: [['jacket', 37], ['braid', 31], ['insulator', 18], ['copper core', 4]] },
    { x: 180, y: 120, t: 'Fibre-optic', layers: [[40, '#facc15', '#a16207'], [34, '#fef3c7'], [24, '#a5f3fc', '#0e7490'], [11, 'url(#fglow)']], call: [['jacket', 37], ['buffer', 29], ['cladding', 18], ['glass core', 5]] }
  ];
  let o = `<defs><radialGradient id="fglow"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></radialGradient></defs>`;
  cells.forEach(c => {
    const cx = c.x + 52, cy = c.y + 66;
    o += `<text x="${c.x + 8}" y="${c.y + 14}" class="d-t d-b">${c.t}</text>`;
    c.layers.forEach(l => { o += `<circle cx="${cx}" cy="${cy}" r="${l[0]}" fill="${l[1]}"${l[2] ? ` stroke="${l[2]}" stroke-width="2"` : ''}/>`; });
    if (c.foil) o += `<circle cx="${cx}" cy="${cy}" r="33" fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    if (c.braid) o += `<circle cx="${cx}" cy="${cy}" r="30.5" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="2 2.5"/>`;
    if (c.pairs) o += pairs(cx, cy);
    const n = c.call.length;
    c.call.forEach((k, i) => {
      const ly = cy + (i - (n - 1) / 2) * 19, a = Math.atan2(ly - cy, 46), px = cx + k[1] * Math.cos(a), py = cy + k[1] * Math.sin(a);
      o += `<line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${c.x + 99}" y2="${ly}" class="d-line" stroke-width="1.2"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2.2" class="d-dot"/><text x="${c.x + 102}" y="${ly}" class="d-t d-small" dominant-baseline="middle">${k[0]}</text>`;
    });
  });
  o += txt(180, 242, 'Pairs are colour coded: orange, green, blue, brown.', 'd-t d-small d-muted');
  return svg(360, 252, o, 'Cross sections: UTP has a jacket and four colour-coded twisted pairs. STP adds a foil shield around the pairs. Coaxial has a copper core, insulator, braided shield and jacket. Fibre-optic has a glass core, cladding, buffer and jacket.');
};

LV('p1-1c',
  [2, 'Pattern recognition is when you look for patterns. The technician could look on the internet for the error code and see if anyone else has had the same problem. They could also ask other technicians for help.', 'It gives a general idea of searching for the error code but only partly uses the scenario. The fault log and the fact the fault has happened three times are ignored. To move up, use each source in the question and explain how it saves time.'],
  [4, 'The technician should look in the school\'s fault log for error code 79, because the fault has happened three times this term so there may be a record of how it was fixed. This would save time as they would not have to work it out from scratch. They could also search the manufacturer\'s support pages for the meaning of the code. If they still cannot fix it they could post on the professional body\'s forum, but they might have to wait for a reply.', 'Good analysis linked to the scenario: three sources are used, each with a reason. It stays at Level 2 because it does not look for what the three occurrences have in common, or weigh up which source to try first.'],
  [6, 'Every source in the scenario is used, the occurrences are compared to find a shared feature, the sources are put in order of speed, and the answer ends by judging the quickest route. It never drifts into other computational thinking skills.']);
LV('p1-3b',
  [3, 'Modularisation is splitting a system into modules. It is good because it is easier to manage and different people can work on different parts. It can be bad because the modules might not work together. Overall I think it is a good idea.', 'The points are generic and could apply to any project. There is no mention of the two week deadline, the three developers or the database being replaced next year, and the conclusion is not supported. To move up, link each point to a detail in the scenario.'],
  [5, 'Modularisation would let the three developers each build one part at the same time, the booking screen, the database and the emails, which would help them finish in two weeks. Each developer could work on what they are best at. However, the modules have to link together, so the developers would need to agree how they connect, which takes time. If one module is late the others might have to wait. I think modularisation is suitable because of the deadline.', 'Points are linked to the scenario and both sides are covered. It misses the database being replaced next year, which strongly favours modularisation, and the conclusion repeats one point instead of weighing benefits against drawbacks.'],
  [9, 'Both sides are developed in context, including the planned database replacement and the need for testing the modules together. The conclusion weighs the points and explains why the benefits outweigh the extra coordination.']);
LV('p1-24',
  [3, 'Device B is better because it has more cores and a faster processor so it will be quicker. Device A has more RAM which is good. Device A has video software already. I would choose Device B because it is faster.', 'It lists some differences but does not explain why they matter for very large video files, and the conclusion ignores the need for memory and storage. To move up, explain the effect of each component on this designer\'s work, for both devices.'],
  [7, 'Device A has 32 GB of RAM, double Device B, so it can hold more of a large video file in memory and will slow down less. It also has a bigger SSD, which matters because video files are large, and the video software is already installed. Device B has 10 cores and a faster clock speed, so it could render videos more quickly. However, 16 GB of RAM and a 256 GB SSD could fill up quickly with large files. Overall Device A is more suitable because the files are very large.', 'A good range of components is compared and linked to the designer\'s needs, with a sensible conclusion. To reach Level 3, develop the trade-offs further, such as the cost and storage used by installing software on Device B, and explain why memory and storage outweigh processing speed here.'],
  [12, 'Every component is evaluated for both devices against the scenario, the trade-offs are weighed, and the conclusion explains which factors matter most and when the other device would be the better choice.']);
LV('p1-210',
  [2, 'Gibbs\' reflective cycle has stages like description, feelings and action plan. Design thinking is about empathising with users. The team could use these to make the helpdesk better.', 'It names parts of each model but does not apply them to the slow helpdesk. To move up, explain what the team would actually do at each stage for this problem.'],
  [4, 'Using Gibbs, the team would describe the complaints about slow responses, think about how staff felt, and evaluate what has gone well and badly. Then they would analyse why it is slow and make an action plan, such as more staff at busy times. Design thinking would start by asking users what they need. The team could then come up with ideas like a self-service portal and test a prototype.', 'Both models are applied to the scenario. It stays at Level 2 because it does not consider drawbacks, such as Gibbs being slow for urgent faults or design thinking needing several cycles, or how the two approaches could work together.'],

LV('p1-31',
  [3, 'The gym has lots of data from card scans so it can see when people come in. But some data is missing so it might not be accurate. The gym should use the data to make timetables.', 'The points are basic and the gap is mentioned without saying why it matters. The conclusion is not supported. To move up, explain which patterns the data can show, how the missing months affect them, and what the data cannot tell the gym.'],
  [5, 'The data is collected automatically from card scans so there are no typing errors, and 14 months is a lot of data. It shows when members visit, so the gym can see busy times and put classes on then. It also shows which members have stopped coming, so offers could be sent to them. However, four months are missing, so some patterns might be wrong, for example a busy month could be missing. Overall the data is suitable for timetables.', 'Good points on both sides, linked to the scenario. The conclusion is only partly supported. It does not explain that the data cannot show which classes members want, or judge timetabling and targeted offers separately.'],
  [9, 'Strengths and weaknesses are weighed for both uses, including what the data cannot show, and the conclusion makes a reasoned recommendation with a way to fill the gaps.']);
LV('p1-312',
  [2, 'A data lake stores data. A data warehouse also stores data and data marts are smaller. The supermarket could use them to store all its sales data.', 'It names the tools but does not explain how they differ or how the supermarket would use them. To move up, describe what each one holds and how it helps plan offers.'],

LV('p2-41b',
  [2, 'The school should recycle the laptops because they have toxic parts. They should also delete the data on them. They should not put them in the bin.', 'The ideas are correct but have no reasons and no link to the law or to the risk of personal data being recovered. To move up, explain why each disposal option is or is not suitable.'],

LV('p2-54',
  [3, 'A pilot is when you try the system in one place first. This is good because if it goes wrong only one garage is affected. It takes longer though. I think they should do a pilot.', 'One benefit and one drawback, with little link to the scenario, such as worried staff and garages that cannot stop working. To move up, develop more points in context and explain why the benefits outweigh the drawbacks.'],

LV('p2-71',
  [3, 'SSDs are faster than hard disks and have no moving parts so they are better. But they cost more. I would use SSDs because they are faster.', 'Generic facts, and the conclusion ignores the scenario: the files are rarely read, so speed hardly matters, and the budget is limited. To move up, test each feature against how this archive is used.'],
  [5, 'SSDs are faster and more reliable because they have no moving parts, but they cost much more per gigabyte, and the school has ten years of backups and a limited budget. Hard disks are cheaper and hold a lot, and their slower speed does not matter much because the files are written once and rarely read. Because the server is never moved, the risk of damaging a hard disk is low. Overall hard disks are more suitable.', 'Strong use of the scenario and a correct conclusion. To reach Level 3, cover more factors, such as power use, fragmentation, drive failure and RAID, and explain why cost and capacity outweigh speed here.'],
  [9, 'Each feature of both drive types is judged against this archive, and the conclusion weighs cost, capacity and reliability, adding RAID for resilience.']);
LV('p2-73a',
  [3, 'Peer-to-peer is cheaper because you do not need a server. Client-server is more secure and easier to back up. I think they should use client-server because it is more secure.', 'Correct general points, but the scenario is not used: the budget, no IT staff, a weekend installation and private client data. To move up, judge each model against these needs.'],
  [7, 'A peer-to-peer network would be cheap because no server is needed, and with five PCs it could be set up over the weekend. However, files would be spread across five computers, so backing up would be harder and it would be harder to control who sees client data. A client-server network keeps files in one place, so backups are easy and permissions can protect client privacy, but a server costs money and needs technical skills, and the firm has no IT staff. I think client-server is better because the firm handles private client data.', 'A good range of points for both models, linked to the scenario. To reach Level 3, weigh the £2,000 budget and the lack of IT staff against privacy and backup, and suggest how the firm could overcome the drawbacks of its chosen model.'],
  [12, 'Both models are evaluated in depth against every requirement, and the conclusion explains which requirements matter most and how to deal with the remaining drawbacks.']);
LV('p2-75',
  [2, 'The cloud means the website will not crash because there is more space. It might cost more. The owner should move to the cloud.', 'Vague points that do not explain elasticity or the December peak, and no issues are considered. To move up, explain how IaaS copes with December demand and what the owner would still be responsible for.'],
  [4, 'With IaaS the owner can add more resources in December when sales double and reduce them afterwards, so the site should stop crashing and they only pay for what they use. The provider looks after the hardware. However, the owner still has to manage the operating system and the website software, which needs skills, and the shop would depend on the provider and the internet connection.', 'Good points on both sides, in context. To reach Level 3, also consider data protection for customer details, the risk of rising costs, and whether PaaS would suit an owner with limited skills.'],
  [6, 'The benefits and issues are analysed in context, including the owner\'s responsibilities under IaaS, security and alternatives, leading to a clear judgement.']);
LV('p2-83b',
  [3, 'Anti-malware stops viruses. Training teaches staff not to click links. Backups mean you can get files back. They are all good so the firm should use all three.', 'Each measure gets one line, with no drawbacks and no link to ransomware, the small budget or the staff\'s skills. To move up, give strengths and weaknesses of each measure for this firm.'],
  [5, 'Anti-malware is cheap and automatic, which suits staff with little technical knowledge, but it might not detect new ransomware. Training helps staff spot phishing emails, which is how ransomware often gets in, but people can still make mistakes. Offline backups mean the firm could restore its files without paying a ransom, because ransomware cannot reach them. Overall the firm should use all three.', 'Strengths and some weaknesses, linked to the scenario. The conclusion is not developed. It does not say which measure matters most, or that backups do not stop confidential data being stolen.'],
  [9, 'Each measure is weighed against ransomware, the budget and the staff\'s skills, the limits of backups for confidentiality are noted, and the conclusion ranks the measures with reasons.']);

// ---- mock papers ----
LV('m1-12',
  [2, 'Decomposition is breaking a problem into smaller parts and abstraction is removing details. The team could use these to design the new process so it works better.', 'Definitions only, with no application to the helpdesk. To move up, show what the parts of the process would be and which details the team would keep or remove.'],
  [4, 'Using decomposition, the team could split the process into receiving requests, logging them, prioritising them and assigning them to technicians. Each part could be designed separately. Using abstraction, they could decide what information each request needs, such as the user, the device and how urgent it is, and leave out other details so the form is quick to fill in.', 'Both skills are applied to the scenario. It stays at Level 2 because it does not explain how this fixes the actual problems, missing details and urgent requests left waiting, or consider any drawbacks.'],
  [6, 'Both skills are applied thoroughly and linked to each problem in the scenario, with drawbacks considered.']);
LV('m1-15c',
  [3, 'The data is good because it shows how much each machine is used. Some data is missing because of the Wi-Fi and some speeds are wrong. FitHub should use the data.', 'The issues are noticed but not explained, and the conclusion ignores them. To move up, explain how the gaps and faulty readings could lead to the wrong machines being replaced.'],
  [5, 'The data comes from sensors so it is collected automatically, and there is 18 months of it, which shows which machines are used most and which report errors. Machines with lots of errors could be replaced first. However, three gyms have months of missing data, so their machines might look less used than they are. Some sensors report impossible speeds, so the data would need cleaning. FitHub can use the data but should be careful.', 'Good points on both sides, in context. The conclusion is only partly supported because it does not say how to deal with the gaps, or what other information, such as machine age and repair costs, is needed for a fair decision.'],
  [9, 'Strengths and weaknesses are analysed in depth, cleaning and validation are suggested, and the conclusion explains how FitHub should use the data safely.']);
LV('m1-16b',
  [3, 'Bottom-up means building small parts first. It is good because you can test each part. It might be harder to join the parts together. I think they should use it.', 'Generic points, with no use of the reusable badge program, the email system, the deadline or the planned car park barrier. To move up, apply each point to this project.'],
  [5, 'The college already has a badge printing program and an email system, so with bottom-up the developers can reuse these working parts and save time, which helps with the four week deadline. Each new part can be tested on its own. However, without an overall design the parts may not fit together, and problems may appear late when everything is combined. Bottom-up is suitable.', 'Points on both sides, linked to the scenario. It does not use the future car park barrier or compare with top-down, and the conclusion does not say how to reduce the risks.'],
  [9, 'The approach is weighed against every detail of the scenario and compared with top-down, and the conclusion includes a sensible way to manage the integration risk.']);
LV('m1-17',
  [3, 'Device B is better because it has 8 cores, 32 GB of RAM and a 1 TB SSD, so it is much faster. Device A is lighter. I would choose Device B because it is more powerful.', 'The specifications are listed, but the technician\'s needs, all-day battery, Ethernet and carrying the laptop, are ignored, so the conclusion is wrong for this scenario. To move up, judge each feature against what the technician has to do.'],
  [7, 'Device A has a 12 hour battery, so it will last a full day at customer sites, and it has an Ethernet port so it can plug straight into switches. It is also lighter to carry. Device B is more powerful with 8 cores and 32 GB of RAM, but its battery only lasts 4 hours and it has no Ethernet port, so the technician would need an adapter. Device A is more suitable because battery life and Ethernet matter most.', 'The key needs are used and the conclusion is right. To reach Level 3, evaluate whether Device A\'s processor and RAM are enough for the diagnostic software, consider storage, and explain when Device B would be the better choice.'],
  [12, 'Every feature of both devices is weighed against the technician\'s work, including whether Device A is powerful enough, and the conclusion is fully justified.']);
LV('m2-10',
  [2, 'The app must follow data protection law because it stores personal information. It should be easy to use for everyone.', 'Two relevant ideas but no detail, and no link to nurses using their own phones. To move up, explain what each law requires here and who might be excluded.'],
  [4, 'Because the app stores names, contact details and working patterns, the trust must follow data protection law, keeping the data secure and only using it for rotas. As nurses use their own phones, which could be lost, the app needs strong passwords or MFA. Some nurses may not have a suitable smartphone or may lack digital skills, so the trust should offer another way to swap shifts.', 'Good application of data protection and inclusion. To reach Level 3, include the public sector accessibility regulations and the Equality Act, for example making sure swapping rules do not disadvantage nurses with protected characteristics.'],
  [6, 'Data protection, security, equality, accessibility regulations and inclusion are all analysed in the context of nurses using their own phones.']);
LV('m2-13c',
  [3, 'The chatbot will save money because Threadline will not have to pay staff. Customers can get answers at any time. But some people will lose their jobs. Overall it is a good idea.', 'Basic points with no development, and older customers or those with additional needs are ignored. To move up, consider the impact on different customers and the risk of wrong answers, then weigh them.'],
  [5, 'The chatbot can answer questions 24 hours a day and deal with many customers at once, which helps during sales and saves wages. However, customer service staff will lose their jobs, and the chatbot has no empathy for complaints. Older customers or those with additional needs might find it hard to use, so Threadline could lose them. I think Threadline should use the chatbot but keep some staff.', 'Balanced points in context with a sensible conclusion. To reach Level 3, include the risk of generative AI giving wrong answers and the protection of order data, and justify which customers need human support.'],
  [9, 'The effects on the business, staff and different customers are weighed, including AI accuracy and data protection, with a well supported conclusion.']);
LV('m2-14d',
  [3, 'The cloud is good because staff can get files from anywhere. It might not be secure. The firm should move to the cloud.', 'One benefit and one vague concern. The unreliable internet, the unlocked cupboard and the confidential client data are not used. To move up, weigh each benefit and risk against these details.'],
  [5, 'Staff often work from home and at court, so cloud storage would let them reach case files anywhere. The provider would handle backups and security, which removes the risk of the unlocked server cupboard. However, the office internet is sometimes unreliable, so staff might not be able to open files, and the firm would rely on the provider. Overall the cloud is suitable.', 'Good use of the scenario on both sides. The conclusion does not deal with the risks it raised. It should say how to handle the unreliable connection and how to protect confidential client data, for example with MFA.'],
  [9, 'Benefits and risks are weighed in context, and the conclusion sets out the conditions under which the move is suitable.']);
LV('m2-15',
  [3, 'Phased is when you bring the system in bit by bit, and direct is when you change all at once. Phased is safer but slower. Direct is quicker but risky. I would choose phased.', 'Definitions with one point each, and no use of the scenario: clients must still be supported, staff have mixed digital skills and the budget is limited. To move up, apply each method to the charity\'s situation.'],
  [7, 'A phased approach would bring the system into one office at a time, so if there are problems the other offices can keep supporting clients. It also gives time to train staff with weaker digital skills. However, it takes longer and records will be split between the old and new systems. A direct changeover is quicker and cheaper, which suits the limited budget, but if the system fails no office can support clients. Phased is more suitable.', 'Both methods are evaluated in context. To reach Level 3, weigh which factor matters most, protecting clients against cost and speed, and mention the testing, rollback and training needed whichever method is used.'],
  [12, 'Both methods are evaluated thoroughly against every constraint, and the conclusion explains why protecting the service outweighs speed and cost, with steps to reduce the risks.']);

/* ===== EXAMPLE ANSWERS AT EACH LEVEL: MOCK SET B ===== */
LV('m3-12',
  [2, 'There is a lot of data so the council needs a lot of storage. The data comes in fast. Some of it might be wrong.', 'Touches on volume, velocity and veracity but does not explain them or link them to the sensors, cameras and posts, so the analysis is basic.'],
  [4, 'The 2,000 sensors send readings every ten seconds, so the volume is huge and the council needs scalable storage such as the cloud. The velocity is high, so data must be processed as it arrives to manage traffic. The data also has variety, because there are numbers, camera images and text posts, so it cannot all go in one table.', 'Applies three Vs clearly to the scenario. It does not cover veracity (faulty sensors, unreliable posts) or value, and does not link the Vs together.'],
  [6, 'Applies all six Vs to the council\'s data, explains the effect of each on storage and processing, and links them, for example how volume and velocity make cleaning harder.']);
LV('m3-15c',
  [3, 'A data lake stores lots of data. A data warehouse is more organised. The warehouse is better because it is organised.', 'Basic descriptions with no use of the chain\'s data types or its small IT team, and the conclusion is unsupported.'],
  [5, 'A data lake can store all the chain\'s data in its original format, including the free text reviews, and is quick to load. But the data has to be cleaned before use, which is hard for a small IT team. A data warehouse holds cleaned, structured data that is ready for reports, but the reviews would not fit easily. Overall the warehouse is better.', 'Good points for both options in context. The conclusion picks a side but does not explain why the small team and the need for analysis outweigh the lake\'s flexibility, or suggest what to do with the reviews.'],
  [9, 'Weighs both stores against the variety of data and the small team, then reaches a justified conclusion and suggests how to handle the free text reviews.']);
LV('m3-16b',
  [3, 'Waterfall is where you do one stage after another. It is good because it is organised. A drawback is that you cannot go back. It is suitable.', 'A general description of Waterfall with no link to the PC replacement, the fixed holiday deadline or the order of activities.'],
  [5, 'Waterfall suits this project because the requirements are clear: replace 300 PCs. The stages must happen in order, ordering then imaging then installing, which fits Waterfall. However, testing happens at the end, so a problem with the image might be found too late. Overall Waterfall is suitable.', 'Applies Waterfall to the scenario with a strength and a drawback. It does not consider the fixed deadline, late deliveries or Agile as an alternative, and does not suggest reducing the late testing risk.'],
  [9, 'Evaluates Waterfall against the fixed requirements, sequence and deadline, considers late testing and Agile, and concludes with a practical way to reduce the main risk.']);
LV('m3-17',
  [3, 'Fibre-optic is the fastest so it should be used everywhere. UTP is cheap. STP has shielding. The company should use fibre.', 'Facts about each cable are not applied to the 300 metre link, the machinery or the budget, and fibre everywhere ignores the limited budget.'],
  [7, 'Fibre-optic should be used for the 300 metre link because twisted pair only goes about 100 metres, and fibre is not affected by interference. Near the machinery, STP is better than UTP because its shielding reduces interference. In the quiet office, UTP is cheap and easy to install. Overall the company should use a mix of all three.', 'Correct choice for each area with reasons. The evaluation of cost, installation and cable standards is thin, so it stays in Level 2.'],
  [12, 'Judges each cable against each location, the 100 metre limit, interference, cost and installation, and justifies a mixed solution that spends the budget where it is needed.']);
LV('m4-10',
  [2, 'The policy should say what students cannot do, like hacking. It should say what happens if they break the rules.', 'Two relevant points but not developed or linked to the law, the college or why each matters.'],
  [4, 'The policy should list what students may and may not do, such as not sharing passwords or trying to access other accounts, because this is illegal under the Computer Misuse Act. It should explain sanctions, like losing network access, so students know the consequences. It should also say students\' use may be monitored.', 'Covers prohibited activities, the law and sanctions in context. It misses working practices such as protecting other people\'s data, communication etiquette and the college\'s image, and making the policy clear and signed.'],
  [6, 'Covers what is permitted and prohibited, working practices, etiquette, sanctions, monitoring and clarity, explaining why each matters for students and the college.']);
LV('m4-13c',
  [3, 'Biometrics are good because you do not need to remember a password. But some people do not like them. HealthFirst should use them.', 'One benefit and a vague drawback, with no link to older or disabled customers or the sensitive health data. The conclusion is unsupported.'],
  [5, 'Fingerprint login means older customers do not have to remember passwords and it is quicker. It is also safer because nobody can shoulder surf a fingerprint, which matters for health data. However, not all phones have fingerprint readers, and some disabled customers may not be able to use it. Overall it is suitable.', 'Good points on both sides in context. It does not mention that biometric data cannot be changed if leaked, or that a fallback is needed, and the conclusion has no conditions.'],
  [9, 'Weighs convenience and security against device support, accessibility and the sensitivity of biometric data, and concludes that biometrics should be an option with an accessible fallback.']);
LV('m4-14d',
  [3, 'SaaS is software online and IaaS is a server. SaaS is easier. The firm should use SaaS.', 'Basic definitions and a conclusion with no reasons linked to the firm having no IT staff.'],
  [5, 'With IaaS the firm controls the server and software, but it would have to install updates and keep it secure, which is hard with no IT staff. With SaaS the provider does everything except accounts and data, so it is easy to start and updates are automatic. However, the firm relies on the internet and has less control. Overall SaaS is better.', 'Compares both models in context with a supported conclusion. It does not consider data protection for client financial data or when IaaS might be worth it.'],
  [9, 'Weighs control against responsibility for both models, considers cost, reliance and data protection, and concludes with a justified recommendation and the condition for choosing IaaS instead.']);
LV('m4-15',
  [4, 'Working from home is good for staff because they do not have to travel. But they might get lonely. It could be less secure. Overall it is a good idea.', 'Lists points without explaining them or linking them to the bank, the customer data or the home internet. The conclusion is unsupported.'],
  [7, 'Staff save time and money by not commuting, but they may feel isolated and find it hard to switch off from work. For the bank, office costs fall, but calls contain financial details, so home networks and family members overhearing calls are a risk. The bank would need VPNs and secure laptops. Overall the change can work if security is good.', 'Considers staff and the bank with relevant points in context. It does not develop monitoring, the effect of poor home internet on service, or how to introduce the change, so it is at the top of Level 2 rather than Level 3.'],
  [12, 'Evaluates the impact on staff and the bank in depth, including wellbeing, monitoring, security, data protection and service quality, and concludes with conditions and a pilot.']);

/* ===== COMMON MISTAKES: [mistake, what to do instead] for every topic =====
   Lines that mention the sample mark scheme come from its "do not accept" guidance. */
const MISTAKES = {
  '1.1': [['Mixing up abstraction and decomposition.', 'Decomposition breaks a problem into smaller parts. Abstraction removes detail that does not matter. Learn one example of each.'], ['Claiming a pattern from too little evidence, such as "the fault happens once a year".', 'A pattern needs repeated evidence. The sample mark scheme rejects answers that follow a false pattern.'], ['Defining the skill but not applying it.', 'When there is a scenario, say how the technician would use the skill in that situation.']],
  '1.2': [['Using the wrong flowchart symbols, such as a rectangle for a decision.', 'Decisions are diamonds with two labelled exits. Inputs and outputs are parallelograms. Start and end are rounded terminators.'], ['Leaving decision exits unlabelled or arrows without heads.', 'Label every exit from a decision (Yes and No) and put an arrowhead on every flow line.'], ['Mixing up selection and iteration.', 'Selection chooses a path (IF). Iteration repeats steps (WHILE, FOR). Say which the algorithm uses and where.']],
  '1.3': [['Naming the wrong strategy, such as bottom-up when the work starts from an overall plan.', 'Top-down starts with the whole system and breaks it down. Bottom-up builds and tests small parts first, then joins them.'], ['Confusing incident management with root cause analysis.', 'Incident management restores the service quickly. Root cause analysis finds why it happened so it does not happen again.'], ['Putting the stages of high-level problem solving in the wrong order.', 'Define, gather information, analyse, make a plan, implement, review.']],
  '2.1': [['Mixing up a switch and a router.', 'A switch connects devices within one network using MAC addresses. A router connects different networks using IP addresses.'], ['Putting a general BLOCK rule above specific ALLOW rules.', 'Firewall rules are checked from the top down, so specific ALLOW rules must sit above a general BLOCK rule.'], ['Mixing up the default gateway and the DNS server in ipconfig output.', 'The default gateway is the router\'s address for reaching other networks. A DNS server turns names into IP addresses.']],
  '2.2': [['Choosing fibre-optic everywhere because it is fastest.', 'Fibre costs more and needs specialist installation. Choose it for long runs or heavy interference, and copper for short, cheap runs.'], ['Mixing up UTP and STP.', 'STP has shielding against interference, so it suits noisy areas near machinery. UTP has no shielding and is cheaper.'], ['Forgetting the 100 metre limit for twisted pair Ethernet.', 'For runs over about 100 metres, such as between buildings, use fibre or add network equipment.']],
  '2.3': [['Mixing up latency and jitter.', 'Latency is the delay. Jitter is the variation in that delay between packets, which makes calls choppy.'], ['Saying lossy compression keeps all the data.', 'Lossy removes some data for good to make files smaller (MP3). Lossless keeps every bit (FLAC).'], ['Assuming more bandwidth fixes every call problem.', 'Bandwidth is capacity. Latency, jitter and packet loss can still spoil calls on a fast connection.']],
  '2.4': [['Choosing the device with the biggest numbers without linking them to the user.', 'Explain what each component means for the task, such as RAM for very large files, then decide.'], ['Mixing up RAM and storage.', 'RAM is temporary working memory that is lost when the power goes off. Storage (SSD or hard disk) keeps files long term.'], ['Evaluating things the question does not ask about.', 'The sample mark scheme rejects answers about other software or other uses of the devices. Stick to the stated needs.']],
  '2.5': [['Mixing up boundary and erroneous test data.', 'Boundary data sits at the edges of the valid range, such as 1 and 50. Erroneous data is the wrong type, such as "ten".'], ['Confusing system testing with acceptance testing.', 'System testing checks the whole system works. Acceptance testing is when the client or users confirm it meets their needs.'], ['Saying testing proves there are no faults.', 'Testing finds faults. Passing shows the system works for the data tried, not that it is perfect.']],
  '2.6': [['Mixing up records and fields.', 'A record is one row about one item. A field is one column holding one type of data.'], ['Missing the quotation marks around text in COUNTIF.', 'Write =COUNTIF(D2:D40,"Open"), with the text criterion in quotation marks.'], ['Saying validation proves the data is correct.', 'Validation checks data is sensible or allowed. Verification checks it matches the original source.']],
  '2.7': [['Drawing two-way arrows on a data flow diagram.', 'DFD arrows go one way. Use two labelled arrows if data moves in both directions.'], ['Leaving arrows unlabelled.', 'Every arrow needs a label naming the data or information that moves.'], ['Missing out people, processes or data stores from the scenario.', 'Tick off each item in the question as you draw it, and do not add things that are not there.']],
  '2.8': [['Adding likelihood and severity instead of multiplying them.', 'Risk score is likelihood multiplied by severity, so 3 and 4 gives 12.'], ['Giving mitigations that do not match the risk.', 'The sample mark scheme rejects mitigations that do not address the specified risks. Link each control to its hazard.'], ['Mixing up a hazard and a risk.', 'A hazard is something that could cause harm. The risk is how likely and how serious that harm is.']],
  '2.9': [['Mixing up a Gantt chart and a PERT chart.', 'A Gantt chart shows activities as bars against time. A PERT chart is a network diagram showing dependencies.'], ['Starting an activity before all of its predecessors finish.', 'Check every predecessor. An activity with two predecessors starts after the later one ends.'], ['Saying Agile involves no planning.', 'Agile plans in short sprints with regular reviews. It suits changing requirements, while Waterfall suits fixed ones.']],
  '2.10': [['Putting the stages of Kolb or Gibbs in the wrong order.', 'Kolb: concrete experience, reflective observation, abstract conceptualisation, active experimentation. Gibbs: description, feelings, evaluation, analysis, conclusion, action plan.'], ['Naming the model but not applying it.', 'Say what the person would actually do at each stage in the situation given.']],
  '2.11': [['Calling a source reliable because it is online or looks professional.', 'Judge reliability by bias, evidence and expertise, publication date, and whether other sources agree.'], ['Ignoring the date of technical information.', 'Technology changes quickly, so an old fix may no longer work. Check when it was published.']],
  '3.1': [['Using data and information as if they mean the same thing.', 'Data is raw facts. Information is data with meaning and context. Knowledge is information understood and applied with experience.'], ['Inventing data that the scenario does not mention.', 'The sample mark scheme rejects answers about data the question does not describe, such as reviews or loyalty schemes. Evaluate only the data given.']],
  '3.2': [['Mixing up manipulating and analysing data.', 'Manipulating changes how data is arranged, such as sorting. Analysing looks for patterns and answers.'], ['Saying data turns into knowledge by itself.', 'Information only becomes knowledge when a person understands it and applies it with experience.']],
  '3.3': [['Mixing up discrete and continuous data.', 'Discrete data is counted in whole values, such as tickets. Continuous data is measured and can take any value, such as temperature.'], ['Saying qualitative data cannot be analysed.', 'Qualitative data can be codified into categories, such as tagging comments as positive or negative.']],
  '3.4': [['Storing phone numbers as integers.', 'Phone numbers are strings: they can start with 0 and are never used in calculations.'], ['Mixing up real and integer.', 'Integers are whole numbers. Reals have a decimal part, such as prices.']],
  '3.5': [['Saying CSV handles nested data well.', 'CSV is simple rows and columns. JSON and XML can describe nested or complex structures.'], ['Mixing up ASCII and UTF-8.', 'ASCII has a small character set. UTF-8 also covers accents and other alphabets.']],
  '3.6': [['Saying metadata is the data itself.', 'Metadata describes data, such as a file\'s author, size or date created.'], ['Mixing up directory-based and hierarchy-based structures.', 'Directory-based groups files into folders. Hierarchy-based is a tree in which each item has one parent.']],
  '3.7': [['Mixing up validation and verification.', 'Validation checks data is sensible, such as a range check. Verification checks it matches the original, such as double entry.'], ['Mixing up velocity and veracity.', 'Velocity is how fast data arrives. Veracity is how accurate and trustworthy it is.']],
  '3.8': [['Mixing up transcription and transposition errors.', 'Transcription is copying data wrongly. Transposition is swapping characters, such as 54 for 45. The sample mark scheme does not accept one for the other.'], ['Suggesting a fix that cannot stop the error described.', 'Match the method to the error: drop-down menus stop misspellings, double entry catches typing mistakes.']],
  '3.9': [['Giving benefits of charts in general when asked about dashboards.', 'The sample mark scheme rejects general visualisation benefits here. Dashboard benefits include many measures in one place and a quick, up-to-date overview.'], ['Choosing a visualisation without thinking about the audience.', 'Base the choice on the type of data, the intended audience and the brief.']],
  '3.10': [['Mixing up hierarchical and network models.', 'Hierarchical: each child has one parent, like a tree. Network: records can link to many other records.'], ['Giving a drawback without a reason.', 'Say why it matters, such as "finding a record means following each node in turn, which is slow".']],
  '3.11': [['Mixing up role-based and rule-based access control.', 'RBAC gives access by job role. RuBAC uses rules such as time of day or location.'], ['Describing an API as a database.', 'An API lets one application request data or services from another in a controlled way.']],
  '3.12': [['Treating a data lake and a data warehouse as the same thing.', 'A lake stores raw data in any format. A warehouse stores cleaned, structured data ready for analysis. A mart is a smaller subset for one department.'], ['Describing data mining as collecting data.', 'Data mining analyses large data sets to find hidden patterns, such as products often bought together.']],
  '4.1': [['Naming the wrong law for the situation.', 'Data protection covers personal data. The Computer Misuse Act covers unauthorised access. WEEE covers disposing of electrical equipment.'], ['Saying deleting files makes old drives safe to throw away.', 'Deleted data can often be recovered. Drives should be securely wiped or physically destroyed by a specialist.']],
  '4.2': [['Mixing up a code of conduct and an acceptable use policy.', 'A code of conduct sets professional behaviour. An AUP sets rules for using an organisation\'s systems, with sanctions.'], ['Saying a code of conduct replaces the law.', 'Codes support the law but do not replace it.'], ['Mixing up the standards bodies.', 'IEEE: Ethernet and Wi-Fi. IETF: internet protocols. W3C: web standards. WCAG: accessible web content. EIA/TIA: cabling.']],
  '5.1': [['Mixing up internal and external stakeholders.', 'Internal: owners, directors, employees. External: customers, suppliers, shareholders, investors, government.'], ['Mixing up the public, private and voluntary sectors.', 'Public: run by government. Private: owned privately, usually for profit. Voluntary: charities and not-for-profit groups.']],
  '5.2': [['Describing a digital system without saying what value it adds.', 'Link it to an outcome, such as faster orders, lower costs or better decisions.'], ['Answering about the wrong part of the business.', 'Read which business area the question names and give a benefit for that area.']],
  '5.3': [['Describing how an attack happened when asked about its impact.', 'The sample mark scheme rejects answers about the method of attack. Focus on effects such as fines, lost business and reputation.'], ['Giving vague impacts such as "it would be bad for them".', 'Name the impact and its consequence, such as a fine under data protection law.']],
  '5.4': [['Mixing up phased and pilot changeovers.', 'Phased brings in the system one part at a time. Pilot runs the whole system in one place first.'], ['Saying a direct changeover is best because it is quickest.', 'Direct is fast and cheap but risky. Judge it against how well the organisation could cope if it failed.'], ['Ignoring the reason for change given in the scenario.', 'The sample mark scheme rejects answers not linked to the situation described. Use the trigger the question gives.']],
  '5.5': [['Giving responsibilities from the wrong role.', 'Check whether the question asks about infrastructure, cabling, digital support or digital communications.'], ['Answering about remote support when the question is about working on site, or the other way round.', 'Read how the support is delivered in the scenario and answer for that.']],
  '6.1': [['Giving only one side of an impact question.', 'Digital technology brings positives and negatives. Cover both, then make a judgement.'], ['Forgetting end user characteristics.', 'Consider age, digital skills, literacy, culture and accessibility needs when judging who could be left out.']],
  '6.2': [['Describing the technology without its impact.', 'Say what changes for the organisation or people, such as safer work or job losses.'], ['Mixing up AR and VR.', 'AR overlays digital content on the real world. VR replaces the real world with a virtual one.']],
  '7.1': [['Saying RAID is a backup.', 'RAID keeps a system running when a disk fails, but a deleted or encrypted file is lost on every disk. Backups are still needed.'], ['Mixing up NAS and SAN.', 'NAS shares files over the network. SAN gives servers fast block-level storage.'], ['Assuming an SSD is the best choice for everything.', 'Judge against the need: hard disks are cheaper per gigabyte for large archives that are rarely read.']],
  '7.2': [['Mixing up batch and real-time operating systems.', 'Batch runs large jobs on a schedule. Real-time responds within a guaranteed time, such as in car brakes.'], ['Saying SSDs need defragmenting.', 'Defragmenting helps hard disks. SSDs do not need it.']],
  '7.3a': [['Mixing up topology and network type.', 'Topology is the layout (star, mesh, tree). Network type is the scale (PAN, LAN, WAN).'], ['Saying peer-to-peer is more secure than client-server.', 'Client-server centralises security and backups. Peer-to-peer is cheaper but harder to secure and back up.']],
  '7.3b': [['Putting protocols in the wrong OSI layer.', 'HTTP, SMTP, DNS and DHCP are application layer. TCP and UDP are transport layer. IP and routing protocols are network layer.'], ['Mixing up DNS and DHCP.', 'DNS turns domain names into IP addresses. DHCP gives devices their IP addresses automatically.'], ['Mixing up TCP and UDP.', 'TCP is reliable and ordered, with acknowledgements. UDP is faster with no guarantees, so it suits live calls and streaming.']],
  '7.4': [['Mixing up type 1 and type 2 hypervisors.', 'Type 1 runs directly on the hardware, as in data centres. Type 2 runs on top of an operating system, as on a desktop.'], ['Saying virtual machines need no physical hardware.', 'VMs share the host\'s hardware, so if the host fails, every VM on it stops.']],
  '7.5': [['Mixing up who manages what in IaaS, PaaS and SaaS.', 'IaaS: you manage the operating system and software. PaaS: you manage your apps and data. SaaS: the provider manages almost everything.'], ['Saying the cloud is cheaper in every case.', 'Costs depend on use. Weigh the subscription against buying and running your own hardware.']],
  '7.6': [['Mixing up hot, warm and cold sites.', 'Hot: ready in minutes, most expensive. Warm: some equipment, hours to days. Cold: space only, days to weeks.'], ['Thinking redundancy means removing equipment.', 'Here redundancy means spare parts, such as two power supplies, so there is no single point of failure.']],
  '8.1': [['Putting information in the wrong category.', 'HR: salaries and staff details. Commercially sensitive: client details, IP, sales numbers, contracts. Access: usernames, passwords, PINs, biometrics.'], ['Saying who is harmed without saying how.', 'Name the harm and its consequence for the organisation, its staff or its clients.']],
  '8.2a': [['Mixing up a virus and a worm.', 'A virus attaches to files and spreads when they are run. A worm spreads across networks by itself.'], ['Mixing up phishing and pharming.', 'Phishing tricks people with fake messages. Pharming redirects them to a fake website.'], ['Mixing up DoS and DDoS.', 'A DoS attack comes from one source. A DDoS attack comes from many devices at once, often a botnet.']],
  '8.2b': [['Describing a different vulnerability from the one in the scenario.', 'The sample mark scheme rejects physical vulnerabilities not caused by the situation described. Explain the one given.'], ['Confusing a vulnerability with a threat.', 'A vulnerability is a weakness, such as out-of-date software. A threat is what exploits it, such as malware.']],
  '8.3': [['Mixing up incremental and differential backups.', 'Incremental copies changes since the last backup of any kind. Differential copies changes since the last full backup.'], ['Saying hashing is the same as encryption.', 'Encryption can be reversed with a key. Hashing is one way, which is why it is used to store passwords.'], ['Giving mitigations that do not fit the setting.', 'The sample mark scheme rejects device tracking and wiping where the threat comes from office computers. Match the control to the threat.']],
  '8.4': [['Writing about confidentiality when the question asks about integrity or availability.', 'Check which element is asked for. Integrity: data is accurate and unchanged. Availability: data can be reached when needed.'], ['Mixing up authentication and authorisation.', 'Authentication checks who you are. Authorisation decides what you are allowed to access.']]
};

/* ===== WRITTEN RECALL AND SKILLS DRILLS =====
   G: short answer, auto-marked. Groups separated by ';', accepted wordings by '|'. n = marks (answers needed).
   N: number answer. Rules: '=16', '<1', '>50', '16..19', comma separated, any one satisfied.
   S: exact set of letters (activities). F: exact formula or code line (spaces and case ignored).
   E: explain (2 marks), self-marked against a model point and linked reason.
   K(item, fig): marks a skills drill, optionally with a diagram shown above the question. */
const RECALL = {};
function R(id, items) { (RECALL[id] = RECALL[id] || []).push(...items); }
const G = (q, acc, n = 1, note = '') => ({ t: 'g', q, groups: acc.split(';').map(g => g.split('|').map(s => s.trim()).filter(Boolean)), n, note });
const N = (q, rule, show, note = '') => ({ t: 'n', q, rule, show, note, n: 1 });
const S = (q, set, note = '') => ({ t: 's', q, set: set.split(''), note, n: 1 });
const F = (q, forms, note = '') => ({ t: 'f', q, forms: forms.split('|'), note, n: 1 });
const E = (q, point, reason) => ({ t: 'e', q, point, reason, n: 2 });
const K = (item, fig) => Object.assign(item, { sk: true }, fig ? { fig } : {});

      MP('(b)', { marks: 3, cmd: 'Write', topic: '2.6', q: 'Write the formula for cell E2 that shows Escalate if the hours in C2 are more than 8, and Keep if they are not.', pts: ['IF function used (1)', 'Condition C2>8 (1)', '"Escalate" as the true result and "Keep" as the false result, in that order (1)'], alt: 'Accept =IF(C2<=8,"Keep","Escalate").', model: '=IF(C2>8,"Escalate","Keep")' }),
      MP('(c)', { marks: 6, cmd: 'Draw', topic: '2.7', q: 'The helpdesk is adding a laptop loan system.\n- Students give their student ID.\n- Student names are held in a data store.\n- The helpdesk checks which laptops are available in a Laptops data store.\n- A loan record is saved to a Loans data store.\n- The student is given the laptop number and the return date.\nDraw a data flow diagram for this system.', pts: ['Student shown as a source or destination, with Student ID flowing to the process (1)', 'Students data store with the name flowing to the process (1)', 'Laptops data store with available laptops flowing to the process (1)', 'Loan record (student ID, laptop number, return date) flowing from the process to the Loans data store (1)', 'Laptop number and return date flowing from the process to the Student (1)', 'Correct notation: process named with who and a verb, data stores named with nouns, one-way labelled arrows (1)'], alt: 'Accept any other diagram that accurately represents the system.', model: 'Student (ellipse) sends Student ID to the process Helpdesk: Book laptop loan. The Students data store sends Name to the process. The Laptops data store sends Available laptops to the process. The process sends Student ID, Laptop number and Return date to the Loans data store, and sends Laptop number and Return date back to the Student. Every arrow is one-way and labelled.' })

    MQ(15, { stem: 'FitHub is a chain of gyms. Every treadmill and rowing machine has sensors that send data to FitHub\'s central system.' }, [
      MP('(a)', { marks: 3, cmd: 'Complete', topic: '3.8', fig: 'wrangleBlank', q: 'Figure 5 shows the data wrangling steps FitHub uses on the machine data, with three steps missing. Give the names of steps A, B and C.', pts: ['A: Clean (1)', 'B: Validate (1)', 'C: Enrich (1)'], model: 'A Clean, B Validate, C Enrich.' }),
      MP('(b)', { marks: 2, cmd: 'Explain', topic: '3.11', q: 'Gym managers must only be able to view member records between 6am and 10pm, and only on computers inside their own gym. Explain which type of data access control FitHub should use.', pts: ['Rule-based access control (1)', 'because access depends on rules such as the time of day and the location, not just the person\'s role (1)'], alt: 'Do not accept role-based access control alone.', model: 'Rule-based access control, because access is decided by rules such as time of day and location, not only by job role.' }),
      MP('(c)', { marks: 9, cmd: 'Evaluate', topic: '3.1', levels: true,
        q: 'FitHub wants to use the machine data to decide which machines to replace next year. The data shows how long each machine is used each day, its average speed and any error codes, collected over 18 months. In three gyms the Wi-Fi failed for several months, so no data was received from those machines. Some sensors have also reported impossible speeds.\nEvaluate the suitability of using this data to decide which machines to replace.',
        ind: ['For: sensor data is collected automatically and continuously, avoiding human entry errors', 'For: 18 months gives a large quantity of data, showing patterns of heavy use', 'For: error codes show which machines fail most often, a direct sign they need replacing', 'For: daily usage time shows which machines wear out fastest', 'Against: months of missing data in three gyms could make those machines look little used', 'Against: impossible speed readings lower the veracity, so faulty sensors need cleaning or validation', 'Against: the data does not show machine age, repair costs or member feedback', 'Wrangling (cleaning and validating) would improve reliability before decisions are made', 'Conclusion: suitable with caution, combined with other sources, with gaps and faulty sensors allowed for'],
        model: 'The data has real strengths. It comes from sensors, so it is collected automatically and avoids human entry errors. Eighteen months of readings is a large amount of data, so FitHub can see which machines are used most heavily and for how long, which suggests which will wear out first. The error codes are especially useful, because a machine that reports faults often is a clear candidate for replacement.\nHowever, there are weaknesses. Three gyms had no data for several months, so their machines could look little used and be wrongly kept, or their faults could be missed. Some sensors report impossible speeds, which lowers the veracity of the data. If these readings are not cleaned and validated, faulty sensors could make a working machine look broken. The data also leaves out things that matter, such as machine age, repair costs and what members think.\nOverall, the data is suitable as one source of evidence, especially the usage time and error codes, but only after cleaning and validation. FitHub should treat the three gyms with gaps separately and combine the data with repair records and machine age before deciding.' })
